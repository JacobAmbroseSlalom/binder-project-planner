openapi: 3.1.0
info:
  title: Binder Project Planner API
  version: 0.1.0
  description: REST API for the local Binder Project Planner application.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and database health
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The database is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders:
    get:
      operationId: listBinders
      summary: List all binders
      description: >-
        Returns the complete initial binder-summary collection (no
        pagination), sorted by updatedAt descending and then by binder UUID
        ascending for deterministic ordering.
      responses:
        '200':
          description: The binder-summary collection in its documented sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BinderSummary'
    post:
      operationId: createBinder
      summary: Create a new binder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinderRequest'
      responses:
        '201':
          description: The binder was created.
          headers:
            Location:
              description: The path of the newly created binder resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A binder with the same case-insensitively normalized name already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: getBinder
      summary: Get one binder's details
      description: >-
        Returns binder details for the shared binder context (story 7) and
        the Edit Details tab.
      responses:
        '200':
          description: The binder details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: updateBinder
      summary: Update a binder's details
      description: >-
        Applies a partial update to the documented dirty fields (story 7
        covers name/width/height/pages; later stories add notes, preview
        page, dimension, and lock-state fields).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinderRequest'
      responses:
        '200':
          description: The complete persisted binder after applying the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A binder with the same case-insensitively normalized name already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: listBinderCards
      summary: List a binder's cards
      description: >-
        Returns every binder-owned card, placed and unplaced, without image
        bytes (story 11).
      responses:
        '200':
          description: The binder's cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createBinderCard
      summary: Assign a TCGdex or custom card to a binder slot or the unplaced-cards section
      description: >-
        Creates a binder-owned card from either a normalized TCGdex catalog
        result (story 11, `application/json`) or a manually-entered custom
        card (story 12, `multipart/form-data`) and its target placement, or
        with a fully-null placement to add it to the unplaced-cards section
        instead (story 15). The backend assigns the `source` server-side,
        installs the card's image, and validates a fully-populated
        placement against the binder's current dimensions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCustomCardRequest'
      responses:
        '201':
          description: The card was created and placed.
          headers:
            Location:
              description: The path of the newly created card resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, a placement
            partially (rather than fully) supplied its physical page, row,
            and column, or the supplied placement is not valid within the
            binder's current dimensions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The target placement is already occupied by another card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            A custom card's uploaded file's signature did not match a
            supported image format (story 12).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: The upstream TCGdex image download failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: The upstream TCGdex image download timed out.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /card-catalog/search:
    get:
      operationId: searchCardCatalog
      summary: Search the TCGdex card catalog
      description: >-
        Searches TCGdex through the backend (story 11) and returns
        normalized catalog cards in the provider's original order, without
        application-level pagination or truncation. Story 41 adds the
        optional `language` parameter and, for `language=ja`, an automatic
        English-to-Japanese Pokémon species name translation applied to
        `query` before searching TCGdex. Story 41 also adds the optional
        `includeTcgPocket` parameter, which defaults to `false` (Pokémon
        TCG Pocket cards are excluded from results unless explicitly
        requested).
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: >-
            Defaults to `en` when omitted. For `ja`, the backend first
            attempts to translate `query` as an English Pokémon species name
            (see `CardSearchResponse.translationWarning`).
          schema:
            $ref: '#/components/schemas/CardSearchLanguage'
        - name: includeTcgPocket
          in: query
          required: false
          description: >-
            Defaults to `false` when omitted. When `false`, cards belonging
            to a Pokémon TCG Pocket set (TCGdex's `tcgp` serie) are excluded
            from results; when `true`, they're included alongside all other
            matches.
          schema:
            type: boolean
      responses:
        '200':
          description: The normalized TCGdex search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSearchResponse'
        '400':
          description: >-
            The query is missing, or its trimmed length is below the
            configured minimum.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: The upstream TCGdex search failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: The upstream TCGdex search timed out.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/cardId'
    patch:
      operationId: moveCards
      summary: Move or swap one or two cards' binder positions
      description: >-
        Applies a simple move (one update) or a swap (two updates) of card
        placement coordinates in one database transaction (story 14). The
        path `cardId` must identify the dragged card included among
        `updates`. Each update supplies the affected card's currently
        expected placement plus its final placement; the backend compares
        every expected placement against the persisted row before applying
        any change, so a stale client never silently overwrites a position
        another request already changed. A destination occupied by a card
        not included in `updates` is rejected as a conflict rather than
        applied. Nullable placement triples are accepted (story 15's future
        unplaced-cards section) alongside populated ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCardsRequest'
      responses:
        '200':
          description: >-
            The complete persisted representation of every card updated by
            the move or swap.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The cardId path parameter is not a well-formed UUID, the path
            cardId isn't included in `updates`, a placement is malformed or
            out of the binder's bounds, or the updates don't all belong to
            the same binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: One or more updates identify a card that doesn't exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            An update's expected placement no longer matches the card's
            persisted placement, or the destination is occupied by a card
            not included in `updates`. No card positions are changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteCard
      summary: Permanently delete a binder-owned card
      description: >-
        Permanently deletes the binder-owned card identified by its UUID
        (story 13). Deleting an already-absent card also returns `204 No
        Content`. Card-owned dependent records cascade-delete with the card
        in the same database transaction. If this removes the final card
        reference to its image asset, the backend also deletes the
        image-asset record and local file in that transaction; a failure to
        delete the now-orphaned local file does not roll back the committed
        deletion.
      responses:
        '204':
          description: The card was deleted, or no card existed with the given id.
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/image:
    parameters:
      - $ref: '#/components/parameters/cardId'
    get:
      operationId: getCardImage
      summary: Stream a card's image
      description: >-
        Resolves the card's shared image asset and streams its local file
        with the detected image Content-Type and long-lived immutable
        caching (story 11). Storage IDs and filenames are never exposed.
      responses:
        '200':
          description: The card's image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card, image-asset record, or local file exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/art:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: listBinderArt
      summary: List a binder's multi-slot art
      description: >-
        Returns every binder-owned multi-slot-art record, placed and
        unplaced, without image bytes. Art creation does not exist yet
        (story 25), so this always returns an empty array today.
      responses:
        '200':
          description: The binder's multi-slot art.
          content:
            application/json:
              schema:
                type: array
                items: {}
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    binderId:
      name: binderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    cardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: connected
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
    CreateBinderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - width
        - height
        - pages
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed on the backend; case-insensitive uniqueness is enforced there.
        width:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot columns per binder side.
        height:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot rows per binder side.
        pages:
          type: integer
          minimum: 1
          description: Stored binder-page count. Physical pages range from 1 through 2 * pages.
    UpdateBinderRequest:
      type: object
      additionalProperties: false
      description: >-
        A partial update; only supplied fields are changed. Story 7 covers
        name/width/height/pages; later stories (20-24) add notes, preview
        page, dimension, and lock-state fields to this same request schema.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed on the backend; case-insensitive uniqueness is enforced there.
        width:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot columns per binder side.
        height:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot rows per binder side.
        pages:
          type: integer
          minimum: 1
          description: Stored binder-page count. Physical pages range from 1 through 2 * pages.
    Binder:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - width
        - height
        - pages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        width:
          type: integer
          minimum: 1
          maximum: 8
        height:
          type: integer
          minimum: 1
          maximum: 8
        pages:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BinderSummary:
      type: object
      additionalProperties: false
      description: >-
        The lightweight binder representation used by the home-page binder
        list (story 5). Later stories (20, 22) extend this schema with only
        the additional preview and completion-metric data those features
        require, rather than the complete card and multi-slot-art graph.
      required:
        - id
        - name
        - width
        - height
        - pages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        width:
          type: integer
          minimum: 1
          maximum: 8
        height:
          type: integer
          minimum: 1
          maximum: 8
        pages:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlacementCoordinates:
      type: object
      additionalProperties: false
      description: >-
        One-based physical page, row, and column. All three are populated
        for a placed item and all three are null for an unplaced item
        (story 15's unplaced-cards section).
      required:
        - physicalPage
        - row
        - column
      properties:
        physicalPage:
          type: integer
          minimum: 1
          nullable: true
        row:
          type: integer
          minimum: 1
          nullable: true
        column:
          type: integer
          minimum: 1
          nullable: true
    CardPositionUpdate:
      type: object
      additionalProperties: false
      description: >-
        One card's expected current placement and its final placement
        (story 14), used within `MoveCardsRequest`.
      required:
        - cardId
        - expectedPlacement
        - finalPlacement
      properties:
        cardId:
          type: string
          format: uuid
        expectedPlacement:
          $ref: '#/components/schemas/PlacementCoordinates'
        finalPlacement:
          $ref: '#/components/schemas/PlacementCoordinates'
    MoveCardsRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /cards/{cardId}`'s request body (story 14): one update for a
        simple move, or two updates - the dragged card and the destination's
        prior occupant - for a swap.
      required:
        - updates
      properties:
        updates:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/CardPositionUpdate'
    TcgDexCatalogCard:
      type: object
      additionalProperties: false
      description: >-
        A normalized TCGdex catalog card (story 11), returned by
        `GET /card-catalog/search` and submitted as-is (plus variation and
        placement) to create a TCGdex-sourced binder card.
      required:
        - name
        - setName
        - localNumber
        - providerCardId
        - providerSetId
        - imageUrl
      properties:
        name:
          type: string
        setName:
          type: string
          nullable: true
        localNumber:
          type: string
          nullable: true
        providerCardId:
          type: string
        providerSetId:
          type: string
        imageUrl:
          type: string
          format: uri
          description: The provider's image location; not the frontend-facing image URL.
    CardSearchLanguage:
      type: string
      description: Which TCGdex-language dataset a card-catalog search targets (story 41).
      enum:
        - en
        - ja
    CardSearchResponse:
      type: object
      additionalProperties: false
      description: >-
        `GET /card-catalog/search`'s response body (story 41). Wraps the
        normalized results with a nonblocking translation-warning flag
        instead of returning a bare array, so an unsuccessful
        English-to-Japanese translation attempt can be surfaced without an
        error response.
      required:
        - results
        - translationWarning
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TcgDexCatalogCard'
        translationWarning:
          type: boolean
          description: >-
            True only when `language=ja` and `query` looked like an English
            Pokémon species name attempt but no matching translation was
            found, so TCGdex was searched using the original entered query
            instead.
    CreateCardRequest:
      type: object
      additionalProperties: false
      description: >-
        Creates a TCGdex-sourced binder card (story 11). The backend does
        not refetch card details before saving; it assigns `source`
        server-side and downloads the image from `imageUrl` itself.
      required:
        - name
        - setName
        - localNumber
        - providerCardId
        - providerSetId
        - imageUrl
        - placement
      properties:
        name:
          type: string
        setName:
          type: string
          nullable: true
        localNumber:
          type: string
          nullable: true
        providerCardId:
          type: string
        providerSetId:
          type: string
        imageUrl:
          type: string
          format: uri
        variation:
          type: string
          maxLength: 50
          nullable: true
        placement:
          $ref: '#/components/schemas/PlacementCoordinates'
    CreateCustomCardRequest:
      type: object
      additionalProperties: false
      description: >-
        Creates a manually-entered custom binder card via `multipart/
        form-data` (story 12). The backend assigns `source: 'custom'`
        server-side, never accepts TCGdex identity fields, and computes a
        SHA-256 digest of the uploaded image while streaming it to
        temporary storage so identical uploads share one image asset.
        Placement is optional: supply `physicalPage`, `row`, and `column`
        together for a placed card, or omit all three for an unplaced card
        (story 15's unplaced-cards section) - supplying only some of the
        three is rejected.
      required:
        - name
        - image
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        setName:
          type: string
          maxLength: 100
          description: Trimmed on the backend; a blank value is stored as null.
        localNumber:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        variation:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        physicalPage:
          type: integer
          minimum: 1
        row:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        image:
          type: string
          format: binary
          description: >-
            Required. Must be a JPEG, PNG, or WebP file; the backend
            validates the file's signature rather than trusting its name
            or multipart MIME type.
    Card:
      type: object
      additionalProperties: false
      description: The complete persisted representation of a binder-owned card.
      required:
        - id
        - binderId
        - name
        - setName
        - localNumber
        - source
        - providerCardId
        - providerSetId
        - variation
        - placement
        - imageUrl
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        binderId:
          type: string
          format: uuid
        name:
          type: string
        setName:
          type: string
          nullable: true
        localNumber:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - tcgdex
            - custom
        providerCardId:
          type: string
          nullable: true
        providerSetId:
          type: string
          nullable: true
        variation:
          type: string
          nullable: true
        placement:
          $ref: '#/components/schemas/PlacementCoordinates'
        imageUrl:
          type: string
          format: uri-reference
          description: The backend's own `/cards/{cardId}/image` endpoint URL.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
