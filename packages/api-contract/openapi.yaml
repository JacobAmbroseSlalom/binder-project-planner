        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /printing-cost-entries/{printingCostEntryId}:
    parameters:
      - $ref: '#/components/parameters/printingCostEntryId'
    patch:
      operationId: updatePrintingCostEntry
      summary: Update a Printing cost entry
      description: >-
