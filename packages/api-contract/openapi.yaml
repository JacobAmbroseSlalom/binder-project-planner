openapi: 3.1.0
info:
  title: Binder Project Planner API
  version: 0.1.0
  description: REST API for the local Binder Project Planner application.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and database health
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The database is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders:
    get:
      operationId: listBinders
      summary: List all binders
      description: >-
        Returns the complete initial binder-summary collection (no
        pagination), sorted by updatedAt descending and then by binder UUID
        ascending for deterministic ordering.
      responses:
        '200':
          description: The binder-summary collection in its documented sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BinderSummary'
    post:
      operationId: createBinder
      summary: Create a new binder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinderRequest'
      responses:
        '201':
          description: The binder was created.
          headers:
            Location:
              description: The path of the newly created binder resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A binder with the same case-insensitively normalized name already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: getBinder
      summary: Get one binder's details
      description: >-
        Returns binder details for the shared binder context (story 7) and
        the Edit Details tab.
      responses:
        '200':
          description: The binder details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: updateBinder
      summary: Update a binder's details
      description: >-
        Applies a partial update to the documented dirty fields (story 7
        covers name/width/height/pages; later stories add notes, preview
        page, dimension, and lock-state fields).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinderRequest'
      responses:
        '200':
          description: >-
            The complete persisted binder plus any card/art items moved to
            unplaced by a confirmed affecting resize (story 27).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBinderResult'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            A binder with the same case-insensitively normalized name already
            exists, or a reducing resize affects currently placed items and
            relocation consent was not supplied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteBinder
      summary: Permanently delete a binder
      description: >-
        Permanently deletes the binder identified by its UUID, along with
        every binder-owned card, multi-slot-art, and dependent record, in
        one database transaction (story 21). Deleting an already-absent
        binder also returns `204 No Content`. Image assets shared with
        other binders remain intact; an image asset is cleaned up only
        after its final card or art reference is removed, and filesystem
        cleanup runs after the transaction commits - a file-deletion
        failure does not roll back the committed deletion.
      responses:
        '204':
          description: The binder was deleted, or no binder existed with the given id.
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/resize-preview:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: previewBinderResize
      summary: Preview affected placements for a proposed binder resize
      description: >-
        Read-only dry run for story 27. Validates the proposed width,
        height, and stored page count against currently persisted placed
        cards and multi-slot art, returning every affected id plus separate
        card/art counts without changing any data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizePreviewRequest'
      responses:
        '200':
          description: The affected placed card/art ids and separate counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResizePreviewResult'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: duplicateBinder
      summary: Duplicate a binder and every record it owns
      description: >-
        Reads and deep-copies the authoritative binder graph - the binder
        itself plus every owned card, multi-slot-art, and dependent record
        - in one database transaction (story 21). Copied records reference
        the source records' existing immutable image assets rather than
        copying image files. The backend names the copy by trying the
        source name plus " Copy", then " Copy 2", " Copy 3", and increasing
        integers until the case-insensitively normalized name is unique,
        truncating the source-name portion as needed to fit the 100-
        character binder-name limit. Requires a client-generated
        `Idempotency-Key` header; retrying the same key replays the
        original response instead of creating a second copy, for the
        shared 24-hour mutation-idempotency retention period.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicate binder's complete home-page binder summary.
          headers:
            Location:
              description: The path of the newly created binder resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinderSummary'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            Idempotency-Key header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/exports/pdf:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: exportBinderLayoutPdf
      summary: Export a binder's layout as a PDF
      description: >-
        Generates a print-ready PDF of the binder's complete layout (story
        29) from one transactionally consistent snapshot of the persisted
        binder, card, art, transform, and style data - never from the
        browser's own DOM/context. Each displayed spread (the first/last
        single-sided page, and every intermediate left-right spread)
        renders as one US Letter landscape PDF page, proportionally scaled
        to fit within a 0.25-inch margin. The backend finishes generation
        in a request-scoped temporary file before sending response
        headers, then streams the completed file; a missing, unreadable,
        or unsupported local image fails the complete export with Problem
        Details rather than omitting the item or generating a partial
        file. Binder lock state never restricts this read-only endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportBinderPdfRequest'
      responses:
        '200':
          description: The generated binder-layout PDF.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with the sanitized binder name followed by
                `.pdf` as the suggested download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            PDF generation failed - for example, a placed card or art item's
            local image file is missing, unreadable, or not a supported
            format. No temporary file is left behind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/exports/art-pdf:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: exportArtPrintPdf
      summary: Export selected placed multi-slot art as a print-ready PDF
      description: >-
        Generates a print-ready PDF containing only the submitted, currently
        placed multi-slot art (story 30) from one transactionally consistent
        snapshot of the persisted binder and art data, packed across as many
        US Letter landscape pages as needed by a documented deterministic
        rectangle-packing heuristic - never a fixed one-page-per-spread
        layout, and never including any card. A piece of art too large to
        fit one page in either orientation is tiled across multiple pages
        with a fixed physical overlap between adjacent tiles; tiled pages
        add no assembly text (no titles, tile numbers, or row/column
        labels). The backend finishes generation in a request-scoped
        temporary file before sending response headers, then streams the
        completed file; a missing, unreadable, or unsupported local image
        fails the complete export with Problem Details rather than omitting
        the item or generating a partial file. Binder lock state never
        restricts this read-only endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportArtPdfRequest'
      responses:
        '200':
          description: The generated print-art PDF.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with the sanitized binder name followed by
                `-art.pdf` as the suggested download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, `selectedArtIds`
            was empty, or an id in `selectedArtIds` does not currently
            identify placed art in this binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            PDF generation failed - for example, a selected art item's local
            image file is missing, unreadable, or not a supported format.
            No temporary file is left behind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: listBinderCards
      summary: List a binder's cards
      description: >-
        Returns every binder-owned card, placed and unplaced, without image
        bytes (story 11).
      responses:
        '200':
          description: The binder's cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createBinderCard
      summary: Assign a manually-entered custom card to a binder slot or the unplaced-cards section
      description: >-
        Creates a binder-owned custom card from a manually-entered card
        (story 12, `multipart/form-data`) and its target placement, or with
        a fully-null placement to add it to the unplaced-cards section
        instead (story 15). The backend assigns `source: 'custom'`
        server-side, installs the uploaded image, and validates a
        fully-populated placement against the binder's current dimensions.
        TCGdex-card creation, including for a single selected card, instead
        uses `POST /binders/{binderId}/cards/bulk` (stories 11, 17, and
        18); there is no single-card TCGdex JSON variant of this endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCustomCardRequest'
      responses:
        '201':
          description: The card was created and placed.
          headers:
            Location:
              description: The path of the newly created card resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, a placement
            partially (rather than fully) supplied its physical page, row,
            and column, or the supplied placement is not valid within the
            binder's current dimensions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The target placement is already occupied by another card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            A custom card's uploaded file's signature did not match a
            supported image format (story 12).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards/bulk:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: createCardsBulk
      summary: Create one or more independent TCGdex cards in a binder
      description: >-
        Creates one or more binder-owned TCGdex cards from an array of
        normalized catalog search results the user selected (stories 17 and
        18) - the sole TCGdex-card creation path; a single selected card is
        submitted as a one-element array rather than a separate single-card
        request. Each submitted card is persisted independently rather
        than in one all-or-nothing transaction. When `targetPlacement` is
        supplied, only the first array element is attempted at that
        placement (used only when the card-selection modal was opened from
        an empty binder slot); every other element, and the first element
        when `targetPlacement` is omitted, uses all-null placement
        coordinates (the unplaced-cards section). If the first element's
        placement attempt fails for any reason, no other submitted card
        claims that slot. Outcomes preserve the submitted array's order
        regardless of processing completion order. The backend processes
        at most `BULK_CARD_CREATE_CONCURRENCY` card creations concurrently.
        Requires a client-generated `Idempotency-Key` header; retrying the
        same key replays the original outcome instead of creating
        additional cards, for the shared 24-hour mutation-idempotency
        retention period. At most one bulk request may run at a time for a
        given binder.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateCardsRequest'
      responses:
        '201':
          description: Every submitted card was created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkCardOutcome'
        '207':
          description: >-
            One or more submitted cards failed to be created, including a
            batch in which every card failed. The response body still
            contains an outcome entry for every submitted card.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkCardOutcome'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            Idempotency-Key header is missing, the request body did not
            match the documented schema, or `targetPlacement` is not valid
            within the binder's current dimensions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Another bulk card-creation request is already running for this binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /card-catalog/search:
    get:
      operationId: searchCardCatalog
      summary: Search the TCGdex card catalog
      description: >-
        Searches TCGdex through the backend (story 11) and returns
        normalized catalog cards in the provider's original order, without
        application-level pagination or truncation. Story 41 adds the
        optional `language` parameter and, for `language=ja`, an automatic
        English-to-Japanese Pokémon species name translation applied to
        `query` before searching TCGdex. Story 41 also adds the optional
        `includeTcgPocket` parameter, which defaults to `false` (Pokémon
        TCG Pocket cards are excluded from results unless explicitly
        requested).
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: >-
            Defaults to `en` when omitted. For `ja`, the backend first
            attempts to translate `query` as an English Pokémon species name
            (see `CardSearchResponse.translationWarning`).
          schema:
            $ref: '#/components/schemas/CardSearchLanguage'
        - name: includeTcgPocket
          in: query
          required: false
          description: >-
            Defaults to `false` when omitted. When `false`, cards belonging
            to a Pokémon TCG Pocket set (TCGdex's `tcgp` serie) are excluded
            from results; when `true`, they're included alongside all other
            matches.
          schema:
            type: boolean
      responses:
        '200':
          description: The normalized TCGdex search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSearchResponse'
        '400':
          description: >-
            The query is missing, or its trimmed length is below the
            configured minimum.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: The upstream TCGdex search failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: The upstream TCGdex search timed out.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/cardId'
    patch:
      operationId: updateCard
      summary: Move/swap one or two cards' binder positions, or update a card's variation
      description: >-
        Either applies a simple move (one update) or a swap (two updates) of
        card placement coordinates in one database transaction (story 14),
        or updates the path card's `variation` field (story 16) - the
        request body's shape determines which. For a move/swap, the path
        `cardId` must identify the dragged card included among `updates`.
        Each update supplies the affected card's currently expected
        placement plus its final placement; the backend compares every
        expected placement against the persisted row before applying any
        change, so a stale client never silently overwrites a position
        another request already changed. A destination occupied by a card
        not included in `updates` is rejected as a conflict rather than
        applied. Nullable placement triples are accepted (story 15's
        unplaced-cards section) alongside populated ones. For a variation
        update, the trimmed value replaces the card's existing variation
        using last-write-wins semantics (no expected prior value or
        timestamp is compared).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MoveCardsRequest'
                - $ref: '#/components/schemas/UpdateCardVariationRequest'
      responses:
        '200':
          description: >-
            For a move/swap, the complete persisted representation of every
            card updated by the move or swap. For a variation update, the
            complete persisted representation of the path card.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  - $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The cardId path parameter is not a well-formed UUID, the path
            cardId isn't included in `updates`, a placement is malformed or
            out of the binder's bounds, or the updates don't all belong to
            the same binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: One or more updates identify a card that doesn't exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            An update's expected placement no longer matches the card's
            persisted placement, or the destination is occupied by a card
            not included in `updates`. No card positions are changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteCard
      summary: Permanently delete a binder-owned card
      description: >-
        Permanently deletes the binder-owned card identified by its UUID
        (story 13). Deleting an already-absent card also returns `204 No
        Content`. Card-owned dependent records cascade-delete with the card
        in the same database transaction. If this removes the final card
        reference to its image asset, the backend also deletes the
        image-asset record and local file in that transaction; a failure to
        delete the now-orphaned local file does not roll back the committed
        deletion.
      responses:
        '204':
          description: The card was deleted, or no card existed with the given id.
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/cardId'
    post:
      operationId: duplicateCard
      summary: Duplicate a card into the unplaced-cards section
      description: >-
        Creates a new, always-unplaced card copying every card-owned field
        from the source card and sharing its existing image asset (story
        19). Requires a client-generated `Idempotency-Key` header; retrying
        the same key replays the original response instead of creating a
        second copy, for the shared 24-hour mutation-idempotency retention.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicate card, created in the unplaced-cards section.
          headers:
            Location:
              description: The path of the newly created card resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The cardId path parameter is not a well-formed UUID, or the
            Idempotency-Key header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/image:
    parameters:
      - $ref: '#/components/parameters/cardId'
    get:
      operationId: getCardImage
      summary: Stream a card's image
      description: >-
        Resolves the card's shared image asset and streams its local file
        with the detected image Content-Type and long-lived immutable
        caching (story 11). Storage IDs and filenames are never exposed.
      responses:
        '200':
          description: The card's image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card, image-asset record, or local file exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/art:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: listBinderArt
      summary: List a binder's multi-slot art
      description: >-
        Returns every binder-owned multi-slot-art record, placed and
        unplaced, without image bytes (story 25). Placement is always null
        today - placing art on the layout is story 26's scope.
      responses:
        '200':
          description: The binder's multi-slot art.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Art'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createBinderArt
      summary: Create multi-slot art in the unplaced-art section
      description: >-
        Creates binder-owned multi-slot art from one multipart request
        containing the image and normalized art metadata (story 25). New
        art always starts unplaced (all-null placement); placing it on the
        layout is story 26's scope.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateArtRequest'
      responses:
        '201':
          description: The art was created in the unplaced-art section.
          headers:
            Location:
              description: The path of the newly created art resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, or
            `widthSlots`/`heightSlots` exceed the binder's current
            width/height.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            The uploaded file's signature did not match a supported image
            format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /art/{artId}:
    parameters:
      - $ref: '#/components/parameters/artId'
    patch:
      operationId: updateArt
      summary: Move or edit one multi-slot art item
      description: >-
        Applies either a placement move or a metadata/image edit to one art
        item (story 26), branching on the request's content type. An
        `application/json` body moves the art to a new placement (or to
        the unplaced-art section) using the same expected/final
        compare-before-write pattern as `PATCH /cards/{cardId}`; art never
        swaps, so exactly one placement pair is supplied. A
        `multipart/form-data` body edits the art's own title, description,
        dimensions, positioning/scaling/rotation, and style overrides, and
        may optionally replace its image; if edited dimensions would leave
        currently-placed art out of bounds or overlapping another item, the
        request is rejected with `409 Conflict` unless
        `moveToUnplacedOnConflict` is `true`, in which case the art is
        saved and moved to the unplaced-art section in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveArtRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateArtRequest'
      responses:
        '200':
          description: The art item's complete persisted representation after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art'
        '400':
          description: >-
            The artId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema (a malformed
            placement, or metadata failing validation).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No art exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            A move's expected placement no longer matches the art's
            persisted placement, the destination is occupied, or an edit's
            new dimensions would leave placed art out of bounds or
            overlapping another item without `moveToUnplacedOnConflict`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            A replacement image's signature did not match a supported
            image format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteArt
      summary: Permanently delete a binder-owned multi-slot art item
      description: >-
        Permanently deletes the binder-owned art item identified by its
        UUID (story 26). Deleting an already-absent art item also returns
        `204 No Content`. If this removes the final art reference to its
        image asset, the backend also deletes the image-asset record and
        its local file(s); a failure to delete the now-orphaned local
        file(s) does not roll back the committed deletion.
      responses:
        '204':
          description: The art item was deleted, or no art existed with the given id.
        '400':
          description: The artId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /art/{artId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/artId'
    post:
      operationId: duplicateArt
      summary: Duplicate a multi-slot art item into the unplaced-art section
      description: >-
        Creates a new, always-unplaced art item sharing the source item's
        image asset and every editable property (story 26). Requires a
        client-generated `Idempotency-Key` header; retrying the same key
        replays the original response instead of creating a second copy,
        for the shared 24-hour mutation-idempotency retention period.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicate art item, created in the unplaced-art section.
          headers:
            Location:
              description: The path of the newly created art resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art'
        '400':
          description: >-
            The artId path parameter is not a well-formed UUID, or the
            Idempotency-Key header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No art exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /art/{artId}/image:
    parameters:
      - $ref: '#/components/parameters/artId'
    get:
      operationId: getArtImage
      summary: Stream a multi-slot art item's rendering image
      description: >-
        Resolves the art's shared image asset and streams its
        orientation-normalized local file with the detected image
        Content-Type and long-lived immutable caching (story 25). Storage
        IDs and filenames are never exposed.
      responses:
        '200':
          description: The art's image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '400':
          description: The artId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No art, image-asset record, or local file exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/art-print-page-count:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: getArtPrintPageCount
      summary: Get the computed page count for this binder's placed multi-slot art
      description: >-
        Story 34: returns only the page count the binder's currently
        placed multi-slot art would print across, reusing the same
        packing/tiling logic as `POST /binders/{binderId}/exports/art-pdf`
        (story 30) without generating a PDF - the Finances tab calls this
        instead to learn the page count that drives its Printing,
        Holographic Paper, and time-based cost calculations. Read-only, so
        binder lock state never restricts it. The backend caches the
        result on the binder row and only recomputes it when a lightweight
        signature (placed-art count, placed-art max updatedAt, and the
        binder's own updatedAt) no longer matches what's cached.
      responses:
        '200':
          description: The computed page count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtPrintPageCountResult'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /finance-settings:
    get:
      operationId: getFinanceSettings
      summary: Get the global finance-settings singleton
      description: >-
        Story 34: the wage-per-hour rate, shared error-margin percentage,
        and each of the 5 fixed time-cost categories' own reference-minutes/
        reference-pages rate basis - one global resource, never scoped to a
        binder, seeded by the schema migration.
      responses:
        '200':
          description: The current finance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSettings'
    patch:
      operationId: updateFinanceSettings
      summary: Update the global finance-settings singleton
      description: >-
        Applies a partial update; only supplied fields (including nested
        `timeCosts` category fields) are changed. Never restricted by any
        binder's lock state, since this resource isn't scoped to a binder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinanceSettingsRequest'
      responses:
        '200':
          description: The updated finance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSettings'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binder-cost-entries:
    get:
      operationId: listBinderCostEntries
      summary: List the shared Binder physical-cost catalog
      description: >-
        Story 34: returns every saved Binder cost entry, ordered
        alphabetically by name (case-insensitive). The frontend's dropdown
        further filters this list to entries whose stored width, height,
        and pages match the current binder.
      responses:
        '200':
          description: The Binder cost entry collection, alphabetically ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BinderCostEntry'
    post:
      operationId: createBinderCostEntry
      summary: Create a new Binder cost entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinderCostEntryRequest'
      responses:
        '201':
          description: The Binder cost entry was created.
          headers:
            Location:
              description: The path of the newly created Binder cost entry resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinderCostEntry'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binder-cost-entries/{binderCostEntryId}:
    parameters:
      - $ref: '#/components/parameters/binderCostEntryId'
    patch:
      operationId: updateBinderCostEntry
      summary: Update a Binder cost entry
      description: >-
        Applies a partial update to the shared entry - the change is
        visible to every binder that currently has it selected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinderCostEntryRequest'
      responses:
        '200':
          description: The updated Binder cost entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinderCostEntry'
        '400':
          description: >-
            The binderCostEntryId path parameter is not a well-formed
            UUID, or the request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No Binder cost entry exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /printing-cost-entries:
    get:
      operationId: listPrintingCostEntries
      summary: List the shared Printing physical-cost catalog
      description: >-
        Story 34: returns every saved Printing cost entry, ordered
        alphabetically by name (case-insensitive).
      responses:
