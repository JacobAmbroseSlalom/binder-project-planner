openapi: 3.1.0
info:
  title: Binder Project Planner API
  version: 0.1.0
  description: REST API for the local Binder Project Planner application.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and database health
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The database is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /startup/status:
    get:
      operationId: getStartupStatus
      summary: Check whether launch requires user confirmation before opening the database
      description: >-
        Story 53: "Sync data across laptops via cloud-sync folder". Polled
        by the desktop app while it waits for the backend to come up.
        Before the database is opened, a temporary process may be
        listening in its place if the configured data directory looks
        incomplete (present but with no readable database file - possibly
        still downloading via a cloud-sync client) or another machine's
        sync marker looks recent; either case is surfaced here instead of
        opening the database silently. Once the real application is
        running, this always reports `needsConfirmation: false`, so a
        caller can poll this single endpoint throughout the whole startup
        sequence without needing to know which phase is currently
        listening.
      responses:
        '200':
          description: The current startup confirmation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupStatus'
  /startup/confirm:
    post:
      operationId: confirmStartup
      summary: Resolve a pending startup confirmation
      description: >-
        Story 53: answers a `needsConfirmation: true` `/startup/status`
        response - the caller may choose to proceed with the existing
        (possibly incomplete or still-syncing) data directory as-is, or
        request starting fresh, which discards any unreadable/partial
        database file first. A no-op when nothing is actually pending
        confirmation (e.g. once the real application has taken over).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartupConfirmRequest'
      responses:
        '200':
          description: The decision was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupConfirmResult'
  /binders:
    get:
      operationId: listBinders
      summary: List all binders
      description: >-
        Returns the complete initial binder-summary collection (no
        pagination), sorted by updatedAt descending and then by binder UUID
        ascending for deterministic ordering.
      responses:
        '200':
          description: The binder-summary collection in its documented sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BinderSummary'
    post:
      operationId: createBinder
      summary: Create a new binder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinderRequest'
      responses:
        '201':
          description: The binder was created.
          headers:
            Location:
              description: The path of the newly created binder resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A binder with the same case-insensitively normalized name already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: getBinder
      summary: Get one binder's details
      description: >-
        Returns binder details for the shared binder context (story 7) and
        the Edit Details tab.
      responses:
        '200':
          description: The binder details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binder'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: updateBinder
      summary: Update a binder's details
      description: >-
        Applies a partial update to the documented dirty fields (story 7
        covers name/width/height/pages; later stories add notes, preview
        page, dimension, and lock-state fields).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinderRequest'
      responses:
        '200':
          description: >-
            The complete persisted binder plus any card/art items moved to
            unplaced by a confirmed affecting resize (story 27).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBinderResult'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            A binder with the same case-insensitively normalized name already
            exists, or a reducing resize affects currently placed items and
            relocation consent was not supplied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteBinder
      summary: Permanently delete a binder
      description: >-
        Permanently deletes the binder identified by its UUID, along with
        every binder-owned card, multi-slot-art, and dependent record, in
        one database transaction (story 21). Deleting an already-absent
        binder also returns `204 No Content`. Image assets shared with
        other binders remain intact; an image asset is cleaned up only
        after its final card or art reference is removed, and filesystem
        cleanup runs after the transaction commits - a file-deletion
        failure does not roll back the committed deletion.
      responses:
        '204':
          description: The binder was deleted, or no binder existed with the given id.
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/resize-preview:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: previewBinderResize
      summary: Preview affected placements for a proposed binder resize
      description: >-
        Read-only dry run for story 27. Validates the proposed width,
        height, and stored page count against currently persisted placed
        cards and multi-slot art, returning every affected id plus separate
        card/art counts without changing any data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizePreviewRequest'
      responses:
        '200':
          description: The affected placed card/art ids and separate counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResizePreviewResult'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: duplicateBinder
      summary: Duplicate a binder and every record it owns
      description: >-
        Reads and deep-copies the authoritative binder graph - the binder
        itself plus every owned card, multi-slot-art, and dependent record
        - in one database transaction (story 21). Copied records reference
        the source records' existing immutable image assets rather than
        copying image files. The backend names the copy by trying the
        source name plus " Copy", then " Copy 2", " Copy 3", and increasing
        integers until the case-insensitively normalized name is unique,
        truncating the source-name portion as needed to fit the 100-
        character binder-name limit. Requires a client-generated
        `Idempotency-Key` header; retrying the same key replays the
        original response instead of creating a second copy, for the
        shared 24-hour mutation-idempotency retention period.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicate binder's complete home-page binder summary.
          headers:
            Location:
              description: The path of the newly created binder resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinderSummary'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            Idempotency-Key header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /tags:
    get:
      operationId: listTagSuggestions
      summary: List distinct binder tag suggestions
      description: >-
        Story 51: returns the distinct tag text currently used by any
        binder (a `SELECT DISTINCT` over the `BinderTag` table),
        alphabetically ordered case-insensitively, for the tags
        combobox's suggestion list. A tag removed from every binder it was
        on naturally disappears from this list.
      responses:
        '200':
          description: The distinct tag suggestion list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /binders/{binderId}/exports/pdf:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: exportBinderLayoutPdf
      summary: Export a binder's layout as a PDF
      description: >-
        Generates a print-ready PDF of the binder's complete layout (story
        29) from one transactionally consistent snapshot of the persisted
        binder, card, art, transform, and style data - never from the
        browser's own DOM/context. Each displayed spread (the first/last
        single-sided page, and every intermediate left-right spread)
        renders as one US Letter landscape PDF page, proportionally scaled
        to fit within a 0.25-inch margin. The backend finishes generation
        in a request-scoped temporary file before sending response
        headers, then streams the completed file; a missing, unreadable,
        or unsupported local image fails the complete export with Problem
        Details rather than omitting the item or generating a partial
        file. Binder lock state never restricts this read-only endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportBinderPdfRequest'
      responses:
        '200':
          description: The generated binder-layout PDF.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with the sanitized binder name followed by
                `.pdf` as the suggested download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            PDF generation failed - for example, a placed card or art item's
            local image file is missing, unreadable, or not a supported
            format. No temporary file is left behind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/exports/art-pdf:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: exportArtPrintPdf
      summary: Export selected placed multi-slot art as a print-ready PDF
      description: >-
        Generates a print-ready PDF containing only the submitted, currently
        placed multi-slot art (story 30) from one transactionally consistent
        snapshot of the persisted binder and art data, packed across as many
        US Letter landscape pages as needed by a documented deterministic
        rectangle-packing heuristic - never a fixed one-page-per-spread
        layout, and never including any card. A piece of art too large to
        fit one page in either orientation is tiled across multiple pages
        with a fixed physical overlap between adjacent tiles; tiled pages
        add no assembly text (no titles, tile numbers, or row/column
        labels). The backend finishes generation in a request-scoped
        temporary file before sending response headers, then streams the
        completed file; a missing, unreadable, or unsupported local image
        fails the complete export with Problem Details rather than omitting
        the item or generating a partial file. Binder lock state never
        restricts this read-only endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportArtPdfRequest'
      responses:
        '200':
          description: The generated print-art PDF.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with the sanitized binder name followed by
                `-art.pdf` as the suggested download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, `selectedArtIds`
            was empty, or an id in `selectedArtIds` does not currently
            identify placed art in this binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            PDF generation failed - for example, a selected art item's local
            image file is missing, unreadable, or not a supported format.
            No temporary file is left behind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/exports/cards-pdf:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: exportCardsListPdf
      summary: Export a Card List as a print-ready PDF
      description: >-
        Generates a print-ready Card List PDF (story 37) containing only
        the submitted card ids, in the exact order submitted, from one
        transactionally consistent snapshot of the persisted card data. The
        client supplies its currently filtered and sorted card ids - the
        backend never recomputes search, sort, or filter state itself,
        mirroring the art-pdf export's `selectedArtIds` contract. Pages use
        US Letter portrait dimensions with a fixed 4-column by 6-row grid (24
        cards per page); each entry renders only the card's image and
        variation label, no other card details. The backend finishes
        generation in a request-scoped temporary file before sending
        response headers, then streams the completed file; a missing,
        unreadable, or unsupported local image fails the complete export
        with Problem Details rather than omitting the item or generating a
        partial file. Binder lock state never restricts this read-only
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCardsPdfRequest'
      responses:
        '200':
          description: The generated Card List PDF.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with the sanitized binder name followed by
                `-cards.pdf` as the suggested download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, `cardIds` was
            empty, or an id in `cardIds` does not currently identify a card
            in this binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            PDF generation failed - for example, a selected card's local
            image file is missing, unreadable, or not a supported format.
            No temporary file is left behind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: listBinderCards
      summary: List a binder's cards
      description: >-
        Returns every binder-owned card, placed and unplaced, without image
        bytes (story 11).
      responses:
        '200':
          description: The binder's cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createBinderCard
      summary: Assign a manually-entered custom card to a binder slot or the unplaced-cards section
      description: >-
        Creates a binder-owned custom card from a manually-entered card
        (story 12, `multipart/form-data`) and its target placement, or with
        a fully-null placement to add it to the unplaced-cards section
        instead (story 15). The backend assigns `source: 'custom'`
        server-side, installs the uploaded image, and validates a
        fully-populated placement against the binder's current dimensions.
        TCGdex-card creation, including for a single selected card, instead
        uses `POST /binders/{binderId}/cards/bulk` (stories 11, 17, and
        18); there is no single-card TCGdex JSON variant of this endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCustomCardRequest'
      responses:
        '201':
          description: The card was created and placed.
          headers:
            Location:
              description: The path of the newly created card resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, a placement
            partially (rather than fully) supplied its physical page, row,
            and column, or the supplied placement is not valid within the
            binder's current dimensions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The target placement is already occupied by another card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            A custom card's uploaded file's signature did not match a
            supported image format (story 12).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards/bulk:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: createCardsBulk
      summary: Create one or more independent TCGdex cards in a binder
      description: >-
        Creates one or more binder-owned TCGdex cards from an array of
        normalized catalog search results the user selected (stories 17 and
        18) - the sole TCGdex-card creation path; a single selected card is
        submitted as a one-element array rather than a separate single-card
        request. Each submitted card is persisted independently rather
        than in one all-or-nothing transaction. When `targetPlacement` is
        supplied, only the first array element is attempted at that
        placement (used only when the card-selection modal was opened from
        an empty binder slot); every other element, and the first element
        when `targetPlacement` is omitted, uses all-null placement
        coordinates (the unplaced-cards section). If the first element's
        placement attempt fails for any reason, no other submitted card
        claims that slot. Outcomes preserve the submitted array's order
        regardless of processing completion order. The backend processes
        at most `BULK_CARD_CREATE_CONCURRENCY` card creations concurrently.
        Requires a client-generated `Idempotency-Key` header; retrying the
        same key replays the original outcome instead of creating
        additional cards, for the shared 24-hour mutation-idempotency
        retention period. At most one bulk request may run at a time for a
        given binder.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateCardsRequest'
      responses:
        '201':
          description: Every submitted card was created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkCardOutcome'
        '207':
          description: >-
            One or more submitted cards failed to be created, including a
            batch in which every card failed. The response body still
            contains an outcome entry for every submitted card.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkCardOutcome'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            Idempotency-Key header is missing, the request body did not
            match the documented schema, or `targetPlacement` is not valid
            within the binder's current dimensions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Another bulk card-creation request is already running for this binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards/acquisition:
    parameters:
      - $ref: '#/components/parameters/binderId'
    patch:
      operationId: updateCardsAcquisition
      summary: Bulk-update multiple cards' acquisition state
      description: >-
        Replaces `acquired` for every card identified by `cardIds` in one
        request (story 46), powering the Card List tab's (story 37)
        select-all/deselect-all header control instead of the client
        looping individual `PATCH /cards/{cardId}` requests. Every listed
        card must belong to the path binder. Unlike every other binder-
        scoped mutation, this request remains allowed even when the binder
        is locked, matching the Card List tab's existing lock-state
        exemption (story 32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardsAcquisitionRequest'
      responses:
        '200':
          description: The complete persisted representation of every updated card.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, or one or
            more cardIds don't belong to the path binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            No binder exists with the given id, or one or more cardIds
            don't identify an existing card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards/prices/fetch:
    parameters:
      - $ref: '#/components/parameters/binderId'
    post:
      operationId: fetchCardPrices
      summary: Fetch pokemontcg.io price data for a set of cards
      description: >-
        Requests current pricing data from pokemontcg.io (story 38) for
        exactly the card ids supplied - the Card List tab's "Fetch card
        prices" button sends the card ids its active search/sort/filter
        state currently produces, not every card in the binder. Every
        listed card must belong to the path binder. The backend resolves
        each card's matching pokemontcg.io card (by its TCGdex
        providerSetId or set name, combined with its localNumber) and
        returns normalized per-card price data; a card the backend can't
        confidently match, or that has no TCGplayer price data, is
        reported with an empty variants array rather than failing the
        whole request. Nothing is persisted by this endpoint - fetched
        prices are client-side review state until `PATCH /binders/
        {binderId}/cards/prices` commits them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPriceFetchRequest'
      responses:
        '200':
          description: Per-card price data, in the same order as the request's cardIds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardPriceFetchResult'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, or one or
            more cardIds don't belong to the path binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            No binder exists with the given id, or one or more cardIds
            don't identify an existing card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/cards/prices:
    parameters:
      - $ref: '#/components/parameters/binderId'
    patch:
      operationId: updateCardPrices
      summary: Save reviewed card prices
      description: >-
        Commits every reviewed row's new price at once (story 38's "Save
        all" action), setting each card's `price`, `isManualPrice`, and
        `priceUpdatedAt`. Each submitted price is applied independently, so
        a failure on one card rolls back only that card rather than the
        whole batch, mirroring `POST /binders/{binderId}/cards/bulk`'s
        per-item outcome pattern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardPricesRequest'
      responses:
        '200':
          description: Every submitted price was saved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardPriceUpdateOutcome'
        '207':
          description: >-
            One or more submitted prices failed to save, including a batch
            in which every price failed. The response body still contains
            an outcome entry for every submitted price.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardPriceUpdateOutcome'
        '400':
          description: The binderId path parameter is not a well-formed UUID, or the request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /card-catalog/search:
    get:
      operationId: searchCardCatalog
      summary: Search the card catalog
      description: >-
        Searches a card catalog provider through the backend and returns
        normalized catalog cards in that provider's original order, without
        application-level pagination or truncation. Story 43 adds the
        optional `provider` parameter, letting the caller pick the Pokémon
        TCG API (pokemontcg.io, default) or TCGdex as an independent source
        switch rather than an automatic fallback. Story 41 adds the
        optional `language` parameter and, for `language=ja`, an automatic
        English-to-Japanese Pokémon species name translation applied to
        `query` before searching TCGdex; both `language` and
        `includeTcgPocket` below are accepted but ignored (not errors) when
        `provider=pokemontcg`, since pokemontcg.io has no TCG Pocket-set
        concept and its card data is English-only. Story 41 also adds the
        optional `includeTcgPocket` parameter, which defaults to `false`
        (Pokémon TCG Pocket cards are excluded from results unless
        explicitly requested).
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: >-
            Defaults to `pokemontcg` when omitted (story 43).
          schema:
            $ref: '#/components/schemas/CardSearchProvider'
        - name: language
          in: query
          required: false
          description: >-
            Defaults to `en` when omitted. For `ja`, the backend first
            attempts to translate `query` as an English Pokémon species name
            (see `CardSearchResponse.translationWarning`). Ignored when
            `provider=pokemontcg`.
          schema:
            $ref: '#/components/schemas/CardSearchLanguage'
        - name: includeTcgPocket
          in: query
          required: false
          description: >-
            Defaults to `false` when omitted. When `false`, cards belonging
            to a Pokémon TCG Pocket set (TCGdex's `tcgp` serie) are excluded
            from results; when `true`, they're included alongside all other
            matches. Ignored when `provider=pokemontcg`.
          schema:
            type: boolean
      responses:
        '200':
          description: The normalized TCGdex search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSearchResponse'
        '400':
          description: >-
            The query is missing, or its trimmed length is below the
            configured minimum.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: The upstream TCGdex search failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: The upstream TCGdex search timed out.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/cardId'
    patch:
      operationId: updateCard
      summary: >-
        Move/swap one or two cards' binder positions, or update a card's
        variation or acquisition state
      description: >-
        Either applies a simple move (one update) or a swap (two updates) of
        card placement coordinates in one database transaction (story 14),
        updates the path card's `variation` field (story 16), or updates its
        `acquired` field (story 36) - the request body's shape determines
        which. For a move/swap, the path `cardId` must identify the dragged
        card included among `updates`. Each update supplies the affected
        card's currently expected placement plus its final placement; the
        backend compares every expected placement against the persisted row
        before applying any change, so a stale client never silently
        overwrites a position another request already changed. A
        destination occupied by a card not included in `updates` is
        rejected as a conflict rather than applied. Nullable placement
        triples are accepted (story 15's unplaced-cards section) alongside
        populated ones. For a variation update, the trimmed value replaces
        the card's existing variation using last-write-wins semantics (no
        expected prior value or timestamp is compared). For an acquisition
        update, `acquired` replaces the card's existing value the same way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MoveCardsRequest'
                - $ref: '#/components/schemas/UpdateCardVariationRequest'
                - $ref: '#/components/schemas/UpdateCardAcquiredRequest'
      responses:
        '200':
          description: >-
            For a move/swap, the complete persisted representation of every
            card updated by the move or swap. For a variation or
            acquisition update, the complete persisted representation of the
            path card.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  - $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The cardId path parameter is not a well-formed UUID, the path
            cardId isn't included in `updates`, a placement is malformed or
            out of the binder's bounds, or the updates don't all belong to
            the same binder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: One or more updates identify a card that doesn't exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            An update's expected placement no longer matches the card's
            persisted placement, or the destination is occupied by a card
            not included in `updates`. No card positions are changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteCard
      summary: Permanently delete a binder-owned card
      description: >-
        Permanently deletes the binder-owned card identified by its UUID
        (story 13). Deleting an already-absent card also returns `204 No
        Content`. Card-owned dependent records cascade-delete with the card
        in the same database transaction. If this removes the final card
        reference to its image asset, the backend also deletes the
        image-asset record and local file in that transaction; a failure to
        delete the now-orphaned local file does not roll back the committed
        deletion.
      responses:
        '204':
          description: The card was deleted, or no card existed with the given id.
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/details:
    parameters:
      - $ref: '#/components/parameters/cardId'
    patch:
      operationId: updateCardDetails
      summary: Edit a card's name, set, number, variation, price, and image
      description: >-
        Story 49's Card List row edit action: replaces the path card's
        name, set, number, variation, and price in one request, and
        optionally its image, regardless of the card's `source` (`tcgdex`
        or `custom`). A new image reuses the same digest-deduplicated
        local image storage as custom-card creation (story 12); the
        card's previous image asset is deleted if this save was its last
        remaining reference. If the submitted price differs from the
        card's previously saved price, `isManualPrice` is set to `true`
        and `priceUpdatedAt` to the current time; editing any other field
        leaves both unchanged. Restricted while the card's binder is
        locked (story 32), matching this file's other card-field edits.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateCardDetailsRequest'
      responses:
        '200':
          description: The complete persisted representation of the updated card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The cardId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The card's binder is currently locked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            The uploaded replacement image's signature did not match a
            supported image format (story 12's rule, reapplied here).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/cardId'
    post:
      operationId: duplicateCard
      summary: Duplicate a card into the unplaced-cards section
      description: >-
        Creates a new, always-unplaced card copying every card-owned field
        from the source card and sharing its existing image asset (story
        19). Requires a client-generated `Idempotency-Key` header; retrying
        the same key replays the original response instead of creating a
        second copy, for the shared 24-hour mutation-idempotency retention.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicate card, created in the unplaced-cards section.
          headers:
            Location:
              description: The path of the newly created card resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >-
            The cardId path parameter is not a well-formed UUID, or the
            Idempotency-Key header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/image:
    parameters:
      - $ref: '#/components/parameters/cardId'
    get:
      operationId: getCardImage
      summary: Stream a card's image
      description: >-
        Resolves the card's shared image asset and streams its local file
        with the detected image Content-Type and long-lived immutable
        caching (story 11). Storage IDs and filenames are never exposed.
      responses:
        '200':
          description: The card's image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card, image-asset record, or local file exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/{cardId}/watchlist-entry:
    parameters:
      - $ref: '#/components/parameters/cardId'
    post:
      operationId: addCardToWatchlist
      summary: Add a binder card to the What I'm Looking For list
      description: >-
        Creates a new `WatchlistEntry` referencing the path card (story
        45's "Add to What I'm Looking For" Card List row action), or
        returns the existing entry unchanged if this exact card is already
        on the list - an exact-match check on `cardId`, not a name/set/
        number heuristic, so this never creates a duplicate reference.
      responses:
        '200':
          description: >-
            The entry now on the list for this card - either newly created
            or, if this card was already referenced, its existing entry
            returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntry'
        '400':
          description: The cardId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cards/watchlist-entries/bulk:
    post:
      operationId: bulkAddCardsToWatchlist
      summary: Add multiple binder cards to the What I'm Looking For list at once
      description: >-
        Bulk variant of `POST /cards/{cardId}/watchlist-entry` (story 45):
        adds each submitted card id to the What I'm Looking For list by
        reference, independently and idempotently - a card id already on
        the list is a no-op (its existing entry is returned unchanged)
        rather than creating a duplicate reference, matching the
        single-card endpoint's own behavior. One card id that doesn't
        currently identify a card fails only that item, preserved in the
        response in the request's own `cardIds` order, rather than failing
        the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAddCardsToWatchlistRequest'
      responses:
        '201':
          description: Every submitted card id was successfully added (or already listed).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkAddCardsToWatchlistOutcome'
        '207':
          description: At least one submitted card id failed (see each outcome's own status).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkAddCardsToWatchlistOutcome'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries:
    get:
      operationId: listWatchlistEntries
      summary: List every What I'm Looking For entry
      description: >-
        Returns every entry on the shared "What I'm Looking For" list
        (story 45), both standalone entries and ones referencing an
        existing binder card. A referenced entry's display/edit fields
        (name, price, etc.) are hydrated from its joined `cards` row; a
        standalone entry's fields come from its own columns. Ordered by
        each entry's persisted `sortOrder` (story 52's drag-and-drop
        position) - the frontend applies its own active column sort on
        top of this, or falls back to this order when no column sort is
        active. `pdfExportCutoffCount` is the persisted PDF export
        divider position (story 52), returned alongside the entries since
        it's a single global value rather than a per-entry field.
      responses:
        '200':
          description: Every What I'm Looking For entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntryList'
    post:
      operationId: createWatchlistEntry
      summary: Add a manually-entered custom card directly to the What I'm Looking For list
      description: >-
        Creates a standalone (not linked to any binder) `custom`-sourced
        entry via `multipart/form-data` (story 45), mirroring
        `POST /binders/{binderId}/cards`'s manual-entry request shape
        minus placement/acquisition, which have no meaning for a
        binder-less entry.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateWatchlistEntryRequest'
      responses:
        '201':
          description: The entry was created.
          headers:
            Location:
              description: The path of the newly created entry resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntry'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            The uploaded file's signature did not match a supported image
            format (mirroring story 12's rule).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/bulk:
    post:
      operationId: createWatchlistEntriesBulk
      summary: Add one or more independent TCGdex cards directly to the What I'm Looking For list
      description: >-
        Creates one or more standalone `tcgdex`-sourced entries from an
        array of normalized catalog search results (story 45), mirroring
        `POST /binders/{binderId}/cards/bulk`'s per-item independent-
        outcome pattern minus placement/acquisition. Requires a client-
        generated `Idempotency-Key` header; retrying the same key replays
        the original outcome instead of creating additional entries, for
        the shared 24-hour mutation-idempotency retention period.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateWatchlistEntriesRequest'
      responses:
        '201':
          description: Every submitted entry was created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkWatchlistEntryOutcome'
        '207':
          description: >-
            One or more submitted entries failed to be created, including
            a batch in which every entry failed. The response body still
            contains an outcome entry for every submitted item.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkWatchlistEntryOutcome'
        '400':
          description: >-
            The Idempotency-Key header is missing, or the request body did
            not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/{watchlistEntryId}:
    parameters:
      - $ref: '#/components/parameters/watchlistEntryId'
    patch:
      operationId: updateWatchlistEntry
      summary: Edit a standalone What I'm Looking For entry's own fields
      description: >-
        Replaces a standalone entry's name, set, number, variation, price,
        and optionally its image in one request (story 45), mirroring
        `PATCH /cards/{cardId}/details`. Only valid for a standalone entry
        (`cardId` null) - a referenced entry's fields are instead edited
        through its own card via the existing card endpoints, since they
        write through to the same underlying `Card` row.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateWatchlistEntryRequest'
      responses:
        '200':
          description: The complete persisted representation of the updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntry'
        '400':
          description: >-
            The watchlistEntryId path parameter is not a well-formed UUID,
            the request body did not match the documented schema, or the
            entry references a binder card rather than being standalone.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No entry exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            The uploaded replacement image's signature did not match a
            supported image format (story 12's rule, reapplied here).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteWatchlistEntry
      summary: Remove an entry from the What I'm Looking For list
      description: >-
        Removes the entry from the What I'm Looking For list only (story
        45). For a standalone entry, this is a complete deletion - nothing
        else references its row, so its owned image asset is also removed
        if this was its last reference, mirroring `DELETE /cards/{cardId}`.
        For a referenced entry, only this reference is removed; the
        underlying card (and its binder Card List entry) is untouched.
        Deleting an already-absent entry also returns `204 No Content`.
      responses:
        '204':
          description: The entry was removed, or no entry existed with the given id.
        '400':
          description: The watchlistEntryId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/{watchlistEntryId}/mark-acquired:
    parameters:
      - $ref: '#/components/parameters/watchlistEntryId'
    post:
      operationId: markWatchlistEntryAcquired
      summary: Mark a referenced entry's card as acquired and remove it from the list
      description: >-
        Only valid for an entry referencing a binder card (`cardId` set):
        sets that card's `acquired` field to `true` and removes the
        `WatchlistEntry` row in one transaction (story 45), so a partial
        failure can't leave one change applied without the other.
      responses:
        '204':
          description: The card was marked acquired and the entry was removed.
        '400':
          description: >-
            The watchlistEntryId path parameter is not a well-formed UUID,
            or the entry is standalone (not linked to a binder card).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No entry exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/{watchlistEntryId}/image:
    parameters:
      - $ref: '#/components/parameters/watchlistEntryId'
    get:
      operationId: getWatchlistEntryImage
      summary: Stream a standalone entry's image
      description: >-
        Resolves a standalone entry's own image asset and streams its
        local file, mirroring `GET /cards/{cardId}/image`. Only valid for
        a standalone entry - a referenced entry's `imageUrl` instead points
        at its card's own `/cards/{cardId}/image` endpoint.
      responses:
        '200':
          description: The entry's image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '400':
          description: The watchlistEntryId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            No entry, image-asset record, or local file exists, or the
            entry is a reference rather than standalone.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/exports/pdf:
    post:
      operationId: exportWatchlistPdf
      summary: Export the What I'm Looking For list as a print-ready PDF
      description: >-
        Generates a fixed 2-page, US Letter **portrait** print/export PDF
        (story 45) containing only the submitted entry ids, in the exact
        order submitted - the client supplies its currently filtered/
        searched entries in their manually-dragged order (when set) or
        active column-sort order otherwise, mirroring the Card List PDF
        export's (story 37) `cardIds` contract. Page 1 shows every
        included entry's card image, shrinking (and, once shrinking alone
        isn't enough, overlapping adjacent rows by up to half a card's
        height) as needed so every entry fits on this single page without
        adding further image pages; page 2 repeats the exact same grid
        positions with each entry's name and price as text instead of an
        image. The backend finishes generation in a request-scoped
        temporary file before sending response headers, then streams the
        completed file; a missing, unreadable, or unsupported local image
        fails the complete export with Problem Details rather than
        omitting the entry or generating a partial file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportWatchlistPdfRequest'
      responses:
        '200':
          description: The generated What I'm Looking For PDF.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with a fixed suggested download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The request body did not match the documented schema,
            `watchlistEntryIds` was empty, or an id in
            `watchlistEntryIds` does not currently identify an entry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            PDF generation failed - for example, a selected entry's local
            image file is missing, unreadable, or not a supported format.
            No temporary file is left behind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/prices/fetch:
    post:
      operationId: fetchWatchlistEntryPrices
      summary: Fetch pokemontcg.io price data for a set of What I'm Looking For entries
      description: >-
        Mirrors `POST /binders/{binderId}/cards/prices/fetch` (story 38),
        generalized to work across entries that may reference cards from
        many different binders, or no binder at all - each entry's
        effective set/number identity (from its joined card, or its own
        columns when standalone) is resolved before the same pokemontcg.io
        lookup runs. Nothing is persisted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistEntryPriceFetchRequest'
      responses:
        '200':
          description: >-
            Per-entry price data, in the same order as the request's
            watchlistEntryIds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistEntryPriceFetchResult'
        '400':
          description: >-
            The request body did not match the documented schema, or one
            or more watchlistEntryIds don't identify an existing entry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/prices:
    patch:
      operationId: updateWatchlistEntryPrices
      summary: Save reviewed prices for What I'm Looking For entries
      description: >-
        Mirrors `PATCH /binders/{binderId}/cards/prices` (story 38),
        generalized across entries from many binders or none: a referenced
        entry's update is written to its underlying card (visible back on
        that card's own binder Card List); a standalone entry's update is
        written to its own columns. Each submitted price is applied
        independently, so a failure on one entry rolls back only that
        entry rather than the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWatchlistEntryPricesRequest'
      responses:
        '200':
          description: Every submitted price was saved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistEntryPriceUpdateOutcome'
        '207':
          description: >-
            One or more submitted prices failed to save, including a batch
            in which every price failed. The response body still contains
            an outcome entry for every submitted price.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistEntryPriceUpdateOutcome'
        '400':
          description: The request body did not match the documented schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /watchlist-entries/order:
    patch:
      operationId: updateWatchlistEntryOrder
      summary: Persist the What I'm Looking For list's drag order and PDF export divider
      description: >-
        Story 52's single reorder endpoint: replaces every entry's
        persisted `sortOrder` from the submitted array's own order
        (renumbered 0..n-1) and updates the persisted PDF export divider
        position, together in one transaction. Covers both a plain entry
        drag (only `orderedEntryIds` changes) and a divider drag (only
        `pdfExportCutoffCount` changes) with a single request shape -
        every drag-end always has both values in hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWatchlistEntryOrderRequest'
      responses:
        '200':
          description: The persisted order and divider position were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWatchlistEntryOrderResponse'
        '400':
          description: >-
            `orderedEntryIds` was not exactly a reordering of every
            current entry id, or `pdfExportCutoffCount` was out of range.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/art:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: listBinderArt
      summary: List a binder's multi-slot art
      description: >-
        Returns every binder-owned multi-slot-art record, placed and
        unplaced, without image bytes (story 25). Placement is always null
        today - placing art on the layout is story 26's scope.
      responses:
        '200':
          description: The binder's multi-slot art.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Art'
        '400':
          description: The binderId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createBinderArt
      summary: Create multi-slot art in the unplaced-art section
      description: >-
        Creates binder-owned multi-slot art from one multipart request
        containing the image and normalized art metadata (story 25). New
        art always starts unplaced (all-null placement); placing it on the
        layout is story 26's scope.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateArtRequest'
      responses:
        '201':
          description: The art was created in the unplaced-art section.
          headers:
            Location:
              description: The path of the newly created art resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art'
        '400':
          description: >-
            The binderId path parameter is not a well-formed UUID, the
            request body did not match the documented schema, or
            `widthSlots`/`heightSlots` exceed the binder's current
            width/height.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No binder exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            The uploaded file's signature did not match a supported image
            format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /art/{artId}:
    parameters:
      - $ref: '#/components/parameters/artId'
    patch:
      operationId: updateArt
      summary: Move or edit one multi-slot art item
      description: >-
        Applies either a placement move or a metadata/image edit to one art
        item (story 26), branching on the request's content type. An
        `application/json` body moves the art to a new placement (or to
        the unplaced-art section) using the same expected/final
        compare-before-write pattern as `PATCH /cards/{cardId}`; art never
        swaps, so exactly one placement pair is supplied. A
        `multipart/form-data` body edits the art's own title, description,
        dimensions, positioning/scaling/rotation, and style overrides, and
        may optionally replace its image; if edited dimensions would leave
        currently-placed art out of bounds or overlapping another item, the
        request is rejected with `409 Conflict` unless
        `moveToUnplacedOnConflict` is `true`, in which case the art is
        saved and moved to the unplaced-art section in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveArtRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateArtRequest'
      responses:
        '200':
          description: The art item's complete persisted representation after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art'
        '400':
          description: >-
            The artId path parameter is not a well-formed UUID, or the
            request body did not match the documented schema (a malformed
            placement, or metadata failing validation).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No art exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: >-
            A move's expected placement no longer matches the art's
            persisted placement, the destination is occupied, or an edit's
            new dimensions would leave placed art out of bounds or
            overlapping another item without `moveToUnplacedOnConflict`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            A replacement image's signature did not match a supported
            image format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteArt
      summary: Permanently delete a binder-owned multi-slot art item
      description: >-
        Permanently deletes the binder-owned art item identified by its
        UUID (story 26). Deleting an already-absent art item also returns
        `204 No Content`. If this removes the final art reference to its
        image asset, the backend also deletes the image-asset record and
        its local file(s); a failure to delete the now-orphaned local
        file(s) does not roll back the committed deletion.
      responses:
        '204':
          description: The art item was deleted, or no art existed with the given id.
        '400':
          description: The artId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /art/{artId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/artId'
    post:
      operationId: duplicateArt
      summary: Duplicate a multi-slot art item into the unplaced-art section
      description: >-
        Creates a new, always-unplaced art item sharing the source item's
        image asset and every editable property (story 26). Requires a
        client-generated `Idempotency-Key` header; retrying the same key
        replays the original response instead of creating a second copy,
        for the shared 24-hour mutation-idempotency retention period.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicate art item, created in the unplaced-art section.
          headers:
            Location:
              description: The path of the newly created art resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art'
        '400':
          description: >-
            The artId path parameter is not a well-formed UUID, or the
            Idempotency-Key header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No art exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /art/{artId}/image:
    parameters:
      - $ref: '#/components/parameters/artId'
    get:
      operationId: getArtImage
      summary: Stream a multi-slot art item's rendering image
      description: >-
        Resolves the art's shared image asset and streams its
        orientation-normalized local file with the detected image
        Content-Type and long-lived immutable caching (story 25). Storage
        IDs and filenames are never exposed.
      responses:
        '200':
          description: The art's image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '400':
          description: The artId path parameter is not a well-formed UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No art, image-asset record, or local file exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /binders/{binderId}/art-print-page-count:
    parameters:
      - $ref: '#/components/parameters/binderId'
    get:
      operationId: getArtPrintPageCount
      summary: Get the computed page count for this binder's placed multi-slot art
      description: >-
        Story 34: returns only the page count the binder's currently
        placed multi-slot art would print across, reusing the same
        packing/tiling logic as `POST /binders/{binderId}/exports/art-pdf`
        (story 30) without generating a PDF - the Finances tab calls this
        instead to learn the page count that drives its Printing,
