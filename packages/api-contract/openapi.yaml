openapi: 3.1.0
info:
  title: Binder Project Planner API
  version: 0.1.0
  description: REST API for the local Binder Project Planner application.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and database health
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The database is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: connected
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
