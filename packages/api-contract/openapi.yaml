  /maintenance/orphaned-images:
    delete:
      operationId: deleteOrphanedImages
      summary: Delete orphaned image files and asset records
      description: >-
        Operator-only maintenance endpoint with no frontend usage (see the
        project README's "Maintenance" section). Deletes cardImageAssets/
        artImageAssets database rows that no card or art row references,
        along with their file(s), then deletes any remaining file in the
        local images directory with no asset row at all. Skips any asset
        row or file younger than 5 minutes so a request still in flight is
        never affected.
      responses:
        '200':
          description: The cleanup ran (even if there was nothing to delete).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanedImagesCleanupResult'
  /maintenance/prepare-shutdown:
    post:
      operationId: prepareShutdown
      summary: Back up, checkpoint, and cleanly stop the running application
      description: >-
        Story 53: "Sync data across laptops via cloud-sync folder".
        HTTP-based graceful-shutdown handshake used by the desktop app
        instead of relying on process signals, since a parent process's
        `ChildProcess.kill()` doesn't reliably deliver a catchable signal
        to a child on Windows. Writes a local (never cloud-synced) backup
        snapshot, runs `PRAGMA wal_checkpoint(TRUNCATE)` so the data
        directory is left as a single sync-safe file, then closes the
        database and exits the process after responding.
      responses:
        '200':
          description: >-
            The backup and checkpoint completed; the process will exit
            immediately after this response is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareShutdownResult'
  /exports/data:
    get:
      operationId: exportData
      summary: Export all application data as a portable archive
      description: >-
        Streams a single ZIP archive (story 33) containing a manifest, a
        JSON dump of the durable domain tables, and every referenced image
        file. Built in a request-scoped temporary file that is removed once
        the response completes. Read-only; never restricted by binder lock
        state. Secrets and environment-specific configuration are not
        included.
      responses:
        '200':
          description: The generated export archive.
          headers:
            Content-Disposition:
              description: >-
                `attachment` with a timestamped
                `binder-project-planner-export-*.zip` download filename.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '500':
          description: >-
            Export failed - for example, an image file referenced by an
            asset row is missing from storage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /imports/data/validate:
    post:
      operationId: validateImport
      summary: Validate an import archive and stage it for commit
      description: >-
        Validates an uploaded full-data export archive (story 33) - format,
        schema-version compatibility, image presence/integrity, and internal
        referential integrity - without changing any data. On success the
        extracted archive is staged under a returned token and a summary of
        what a commit would add is returned. Staged imports expire after a
        fixed retention window.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportArchiveUpload'
      responses:
        '200':
          description: The archive is valid and has been staged for commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportValidateResponse'
        '400':
          description: >-
            No archive was supplied, or the archive is not a readable,
            compatible, and internally consistent export.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /imports/data/commit:
    post:
      operationId: commitImport
      summary: Commit a previously validated+staged import
      description: >-
        Applies a staged import identified by its token (story 33): copies
        any new image files in, then inserts every remapped record in one
        database transaction. Imported binders/cards/art are added as new
        records (binder-name collisions are made unique); image assets are
        deduplicated against identical existing assets. On any failure the
        transaction rolls back and the copied files are removed, leaving all
        existing data unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequest'
      responses:
        '200':
          description: The import was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResponse'
        '404':
          description: No staged import exists for the token (it may have expired).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: The import failed to apply; no data was changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    binderId:
      name: binderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    cardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    artId:
      name: artId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    binderCostEntryId:
      name: binderCostEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    printingCostEntryId:
      name: printingCostEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    holographicPaperCostEntryId:
      name: holographicPaperCostEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    watchlistEntryId:
      name: watchlistEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: connected
    StartupStatus:
      type: object
      additionalProperties: false
      required:
        - needsConfirmation
      properties:
        needsConfirmation:
          type: boolean
        reason:
          type: string
          description: >-
            Only present when `needsConfirmation` is true. Reflects whether
            the configured data directory looks incomplete (present but
            with no readable database file yet), or another machine's sync
            marker looks recent.
          enum:
            - incomplete-directory
            - other-machine-recent
        otherMachine:
          type: object
          description: Only present when `reason` is `other-machine-recent`.
          additionalProperties: false
          required:
            - machineId
            - updatedAt
          properties:
            machineId:
              type: string
            updatedAt:
              type: string
              format: date-time
    StartupConfirmRequest:
      type: object
      additionalProperties: false
      properties:
        startFresh:
          type: boolean
          description: >-
            When true, discards any unreadable/partial database file before
            proceeding, rather than trying to open the existing one.
          default: false
    StartupConfirmResult:
      type: object
      additionalProperties: false
      required:
        - acknowledged
      properties:
        acknowledged:
          type: boolean
          const: true
    PrepareShutdownResult:
      type: object
      additionalProperties: false
      required:
        - acknowledged
      properties:
        acknowledged:
          type: boolean
          const: true
    ImportArchiveUpload:
      type: object
      additionalProperties: false
      required:
        - archive
      properties:
        archive:
          type: string
          format: binary
          description: The full-data export ZIP archive to validate and stage.
    ImportSummary:
      type: object
      additionalProperties: false
      description: >-
        Counts of what an import will add (story 33) - surfaced by validate
        as a preview and by commit as the result.
      required:
        - binders
        - cards
        - art
        - newImages
        - dedupedImages
      properties:
        binders:
          type: integer
          minimum: 0
        cards:
          type: integer
          minimum: 0
        art:
          type: integer
          minimum: 0
        newImages:
          type: integer
          minimum: 0
          description: Image assets whose bytes will be copied in as new files.
        dedupedImages:
          type: integer
          minimum: 0
          description: Image assets reused from identical assets already present locally.
    ImportValidateResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - summary
      properties:
        token:
          type: string
          format: uuid
          description: Identifies the staged archive to pass to the commit endpoint.
        summary:
          $ref: '#/components/schemas/ImportSummary'
    ImportCommitRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          format: uuid
          description: The token returned by the validate endpoint.
    ImportCommitResponse:
      type: object
      additionalProperties: false
      required:
        - summary
      properties:
        summary:
          $ref: '#/components/schemas/ImportSummary'
    OrphanedImagesCleanupResult:
      type: object
      additionalProperties: false
      required:
        - deletedFileCount
        - deletedFiles
        - deletedAssetRecordCount
      properties:
        deletedFileCount:
          type: integer
          minimum: 0
        deletedFiles:
          type: array
          items:
            type: string
          description: >-
            Filenames (not full paths) deleted from the local images
            directory.
        deletedAssetRecordCount:
          type: integer
          minimum: 0
          description: >-
            Number of cardImageAssets/artImageAssets database rows deleted
            because no card or art row referenced them.
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
    BinderWidthPerSlot:
      type: number
      exclusiveMinimum: 0
      description: >-
        Centimeters, to two decimal places. Must be greater than zero. Used
        with widthBase to compute displayed width:
        (slots * widthPerSlot) + widthBase.
    BinderWidthBase:
      type: number
      description: >-
        Centimeters, to two decimal places. May be negative only when the
        one-slot computed width (widthPerSlot + widthBase) remains greater
        than zero; the backend rejects combinations that don't.
    BinderHeightPerSlot:
      type: number
      exclusiveMinimum: 0
      description: >-
        Centimeters, to two decimal places. Must be greater than zero. Used
        with heightBase to compute displayed height:
        (slots * heightPerSlot) + heightBase.
    BinderHeightBase:
      type: number
      description: >-
        Centimeters, to two decimal places. May be negative only when the
        one-slot computed height (heightPerSlot + heightBase) remains
        greater than zero; the backend rejects combinations that don't.
    BinderBorderColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: >-
        Six-digit `#RRGGBB` hexadecimal color. The backend normalizes
        hexadecimal letters to uppercase before saving.
    BinderBorderRadius:
      type: number
      minimum: 0
      maximum: 100
      description: Percentage, to two decimal places, from 0 through 100 inclusive.
    BinderBorderWidth:
      type: number
      minimum: 0
      description: >-
        Centimeters, to two decimal places, zero or greater. Unlike
        BinderBorderRadius, this is a physical measurement rather than a
        percentage - the frontend converts it to pixels at render time
        using the same cm-to-px scale factor as the art's own image.
    BinderPreviewPhysicalPage:
      type: integer
      minimum: 1
      description: >-
        Story 20: one-based physical focal page resolved to the same
        single page or two-page spread as layout navigation. Must be
        between 1 and twice the binder's stored page count; the backend
        resets it to the shared DEFAULT_BINDER_PREVIEW_PHYSICAL_PAGE value
        when reducing the stored page count would otherwise make the
        saved value invalid.
    BinderNotes:
      type: string
      maxLength: 1000000
      nullable: true
      description: >-
        Story 23: free-form Markdown-source notes for the binder, or null
        when unset. An exactly-empty string sent on update is normalized to
        null by the backend; non-empty content is stored as-is without
        trimming.
    BinderTags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 30
      description: >-
        Story 51: this binder's tags, in the order they were added. Trimmed
        and case-insensitively deduplicated by the backend (a candidate
        that case-insensitively matches an existing tag is a no-op and
        keeps the existing tag's original casing). Sent as a full
        replacement array by `POST /binders` and
        `PATCH /binders/{binderId}` - there is no separate add/remove
        endpoint or tag-rename operation.
    CreateBinderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - width
        - height
        - pages
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed on the backend; case-insensitive uniqueness is enforced there.
        width:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot columns per binder side.
        height:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot rows per binder side.
        pages:
          type: integer
          minimum: 1
          description: Stored binder-page count. Physical pages range from 1 through 2 * pages.
        widthPerSlot:
          allOf:
            - $ref: '#/components/schemas/BinderWidthPerSlot'
          description: >-
            Defaults to the shared DEFAULT_WIDTH_PER_SLOT_CM value when
            omitted.
        widthBase:
          allOf:
            - $ref: '#/components/schemas/BinderWidthBase'
          description: Defaults to the shared DEFAULT_WIDTH_BASE_CM value when omitted.
        heightPerSlot:
          allOf:
            - $ref: '#/components/schemas/BinderHeightPerSlot'
          description: >-
            Defaults to the shared DEFAULT_HEIGHT_PER_SLOT_CM value when
            omitted.
        heightBase:
          allOf:
            - $ref: '#/components/schemas/BinderHeightBase'
          description: Defaults to the shared DEFAULT_HEIGHT_BASE_CM value when omitted.
        borderColor:
          allOf:
            - $ref: '#/components/schemas/BinderBorderColor'
          description: Defaults to the shared DEFAULT_BORDER_COLOR value when omitted.
        borderRadius:
          allOf:
            - $ref: '#/components/schemas/BinderBorderRadius'
          description: >-
            Defaults to the shared DEFAULT_BORDER_RADIUS_PERCENT value when
            omitted.
        borderWidth:
          allOf:
            - $ref: '#/components/schemas/BinderBorderWidth'
          description: >-
            Defaults to the shared DEFAULT_BORDER_WIDTH_CM value when
            omitted.
        previewPhysicalPage:
          $ref: '#/components/schemas/BinderPreviewPhysicalPage'
        tags:
          allOf:
            - $ref: '#/components/schemas/BinderTags'
          description: >-
            Story 51: defaults to an empty array when omitted. Held in
            local component state on the create-binder page (there is no
            binder to attach tags to yet) and submitted as part of this
            same request.
    UpdateBinderRequest:
      type: object
      additionalProperties: false
      description: >-
        A partial update; only supplied fields are changed. Story 7 covers
        name/width/height/pages; story 24 adds the dimension and
        multi-slot-art style fields below; later stories add notes, preview
        page, and lock-state fields to this same request schema.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed on the backend; case-insensitive uniqueness is enforced there.
        width:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot columns per binder side.
        height:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot rows per binder side.
        pages:
          type: integer
          minimum: 1
          description: Stored binder-page count. Physical pages range from 1 through 2 * pages.
        widthPerSlot:
          $ref: '#/components/schemas/BinderWidthPerSlot'
        widthBase:
          $ref: '#/components/schemas/BinderWidthBase'
        heightPerSlot:
          $ref: '#/components/schemas/BinderHeightPerSlot'
        heightBase:
          $ref: '#/components/schemas/BinderHeightBase'
        borderColor:
          $ref: '#/components/schemas/BinderBorderColor'
        borderRadius:
          $ref: '#/components/schemas/BinderBorderRadius'
        borderWidth:
          $ref: '#/components/schemas/BinderBorderWidth'
        previewPhysicalPage:
          $ref: '#/components/schemas/BinderPreviewPhysicalPage'
        notes:
          $ref: '#/components/schemas/BinderNotes'
        locked:
          type: boolean
          description: >-
            Story 32: when true, rejects every restricted details/layout/
            card/art mutation for this binder with a `409 Conflict` whose
            Problem Details `type` is the stable
            `/problems/locked-binder` value - this field itself is always
            accepted regardless of the binder's current lock state, so a
            locked binder can still be unlocked through this same request.
        moveAffectedItemsToUnplaced:
          type: boolean
          description: >-
            Story 27: include only after the user confirms relocation for an
            affecting resize. When true, the backend atomically updates binder
            details and clears placement coordinates for every item affected at
            transaction time.
        selectedBinderCostEntryId:
          $ref: '#/components/schemas/SelectedBinderCostEntryId'
        selectedPrintingCostEntryId:
          $ref: '#/components/schemas/SelectedPrintingCostEntryId'
        selectedHolographicPaperCostEntryId:
          $ref: '#/components/schemas/SelectedHolographicPaperCostEntryId'
        tags:
          $ref: '#/components/schemas/BinderTags'
    ResizePreviewRequest:
      type: object
      additionalProperties: false
      required:
        - width
        - height
        - pages
      description: >-
        Story 27's dry-run request body for
        `POST /binders/{binderId}/resize-preview`.
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 8
          description: Proposed number of slot columns per binder side.
        height:
          type: integer
          minimum: 1
          maximum: 8
          description: Proposed number of slot rows per binder side.
        pages:
          type: integer
          minimum: 1
          description: Proposed stored binder-page count.
    ResizePreviewResult:
      type: object
      additionalProperties: false
      required:
        - affectedCardIds
        - affectedArtIds
        - affectedCardCount
        - affectedArtCount
      description: >-
        Story 27 dry-run response: every currently placed card/art id that
        would no longer fit the proposed dimensions/pages, plus separate
        counts for each type.
      properties:
        affectedCardIds:
          type: array
          items:
            type: string
            format: uuid
        affectedArtIds:
          type: array
          items:
            type: string
            format: uuid
        affectedCardCount:
          type: integer
          minimum: 0
        affectedArtCount:
          type: integer
          minimum: 0
    UpdateBinderResult:
      type: object
      additionalProperties: false
      required:
        - binder
        - movedCards
        - movedArt
        - affectedCardCount
        - affectedArtCount
      description: >-
        Story 27 update result. For non-affecting updates,
        `movedCards`/`movedArt` are empty and counts are zero. For confirmed
        affecting resizes, includes complete updated representations of every
        card/art moved to unplaced in the same transaction as the binder
        update.
      properties:
        binder:
          $ref: '#/components/schemas/Binder'
        movedCards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        movedArt:
          type: array
          items:
            $ref: '#/components/schemas/Art'
        affectedCardCount:
          type: integer
          minimum: 0
        affectedArtCount:
          type: integer
          minimum: 0
    ExportBinderPdfRequest:
      type: object
      additionalProperties: false
      description: >-
        `POST /binders/{binderId}/exports/pdf`'s request body (story 29).
      properties:
        includeVariations:
          type: boolean
          default: false
          description: >-
            When true, renders each card's saved variation label below it in
            the generated PDF, mirroring the layout tab's own persisted
            (local storage) card-variations visibility toggle. The frontend
            sends `false` (or omits the field) whenever that toggle is off.
    ExportArtPdfRequest:
      type: object
      additionalProperties: false
      required:
        - selectedArtIds
      description: >-
        `POST /binders/{binderId}/exports/art-pdf`'s request body (story
        30) - the print-art selection modal's currently checked art ids.
      properties:
        selectedArtIds:
          type: array
          description: >-
            The ids of the binder's currently placed multi-slot art to
            include in the generated PDF. Every id must currently identify
            placed art in this binder; the array must not be empty.
          items:
            type: string
            format: uuid
    ExportCardsPdfRequest:
      type: object
      additionalProperties: false
      required:
        - cardIds
      description: >-
        `POST /binders/{binderId}/exports/cards-pdf`'s request body (story
        37) - the Card List's currently filtered and sorted card ids,
        in that exact order.
      properties:
        cardIds:
          type: array
          description: >-
            The ids of this binder's cards to include in the generated Card
            List PDF, in the order they should be rendered. Every id
            must currently identify a card in this binder; the array must
            not be empty.
          items:
            type: string
            format: uuid
    Binder:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - width
        - height
        - pages
        - widthPerSlot
        - widthBase
        - heightPerSlot
        - heightBase
        - borderColor
        - borderRadius
        - borderWidth
        - previewPhysicalPage
        - notes
        - locked
        - selectedBinderCostEntryId
        - selectedPrintingCostEntryId
        - selectedHolographicPaperCostEntryId
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        width:
          type: integer
          minimum: 1
          maximum: 8
        height:
          type: integer
          minimum: 1
          maximum: 8
        pages:
          type: integer
          minimum: 1
        widthPerSlot:
          $ref: '#/components/schemas/BinderWidthPerSlot'
        widthBase:
          $ref: '#/components/schemas/BinderWidthBase'
        heightPerSlot:
          $ref: '#/components/schemas/BinderHeightPerSlot'
        heightBase:
          $ref: '#/components/schemas/BinderHeightBase'
        borderColor:
          $ref: '#/components/schemas/BinderBorderColor'
        borderRadius:
          $ref: '#/components/schemas/BinderBorderRadius'
        borderWidth:
          $ref: '#/components/schemas/BinderBorderWidth'
        previewPhysicalPage:
          $ref: '#/components/schemas/BinderPreviewPhysicalPage'
        notes:
          $ref: '#/components/schemas/BinderNotes'
        locked:
          type: boolean
          description: >-
            Story 32: whether restricted details/layout/card/art
            mutations are currently rejected for this binder with a `409
            Conflict`.
        selectedBinderCostEntryId:
          $ref: '#/components/schemas/SelectedBinderCostEntryId'
        selectedPrintingCostEntryId:
          $ref: '#/components/schemas/SelectedPrintingCostEntryId'
        selectedHolographicPaperCostEntryId:
          $ref: '#/components/schemas/SelectedHolographicPaperCostEntryId'
        tags:
          $ref: '#/components/schemas/BinderTags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BinderSummary:
      type: object
      additionalProperties: false
      description: >-
        The lightweight binder representation used by the home-page binder
        list (story 5). Story 20 extends this schema with the dimension/
        style fields (needed to render the embedded preview at the right
        proportions) and the embedded `preview` object itself, rather than
        the complete card and multi-slot-art graph. Story 22 may add
        completion-metric data the same way.
      required:
        - id
        - name
        - width
        - height
        - pages
        - widthPerSlot
        - widthBase
        - heightPerSlot
        - heightBase
        - borderColor
        - borderRadius
        - borderWidth
        - previewPhysicalPage
        - notes
        - locked
        - selectedBinderCostEntryId
        - selectedPrintingCostEntryId
        - selectedHolographicPaperCostEntryId
        - tags
        - totalSlots
        - occupiedSlots
        - emptySlots
        - acquiredCards
        - totalCards
        - preview
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        width:
          type: integer
          minimum: 1
          maximum: 8
        height:
          type: integer
          minimum: 1
          maximum: 8
        pages:
          type: integer
          minimum: 1
        widthPerSlot:
          $ref: '#/components/schemas/BinderWidthPerSlot'
        widthBase:
          $ref: '#/components/schemas/BinderWidthBase'
        heightPerSlot:
          $ref: '#/components/schemas/BinderHeightPerSlot'
        heightBase:
          $ref: '#/components/schemas/BinderHeightBase'
        borderColor:
          $ref: '#/components/schemas/BinderBorderColor'
        borderRadius:
          $ref: '#/components/schemas/BinderBorderRadius'
        borderWidth:
          $ref: '#/components/schemas/BinderBorderWidth'
        previewPhysicalPage:
          $ref: '#/components/schemas/BinderPreviewPhysicalPage'
        notes:
          $ref: '#/components/schemas/BinderNotes'
        locked:
          type: boolean
          description: >-
            Story 32: whether restricted details/layout/card/art
            mutations are currently rejected for this binder with a `409
            Conflict`.
        selectedBinderCostEntryId:
          $ref: '#/components/schemas/SelectedBinderCostEntryId'
        selectedPrintingCostEntryId:
          $ref: '#/components/schemas/SelectedPrintingCostEntryId'
        selectedHolographicPaperCostEntryId:
          $ref: '#/components/schemas/SelectedHolographicPaperCostEntryId'
        tags:
          $ref: '#/components/schemas/BinderTags'
        totalSlots:
          type: integer
          minimum: 0
          description: >-
            Story 22: the total number of card slots in the binder
            (width * height * 2 * pages). The client derives the
            slot-completion percentage as occupiedSlots / totalSlots * 100.
        occupiedSlots:
          type: integer
          minimum: 0
          description: >-
            Story 22: how many slots hold a card or are covered by placed
            multi-slot art, deduplicated across overlaps. Unplaced cards and
            art are excluded.
        emptySlots:
          type: integer
          minimum: 0
          description: >-
            Story 22: totalSlots minus occupiedSlots.
        acquiredCards:
          type: integer
          minimum: 0
          description: >-
            Story 36: how many of the binder's card records (placed and
            unplaced; multi-slot art excluded) have `acquired: true`. The
            client derives the card-acquisition percentage as
            acquiredCards / totalCards * 100, displaying `N/A` when
            totalCards is zero.
        totalCards:
          type: integer
          minimum: 0
          description: >-
            Story 36: the binder's total card-record count (placed and
            unplaced; multi-slot art excluded).
        preview:
          $ref: '#/components/schemas/BinderPreview'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BinderPreviewSpread:
      type: object
      additionalProperties: false
      description: >-
        Story 20: the single page or two-page spread `previewPhysicalPage`
        resolves to, matching layout navigation's own spread resolution.
      required:
        - left
        - right
      properties:
        left:
          type: integer
          minimum: 1
          nullable: true
        right:
          type: integer
          minimum: 1
          nullable: true
    BinderPreviewCard:
      type: object
      additionalProperties: false
      description: >-
        Story 20: one placed card within the preview spread - only the
        placement and image data the miniature layout needs to render it,
        excluding the card's own name/set/variation/source/timestamps.
      required:
        - physicalPage
        - row
        - column
        - imageUrl
      properties:
        physicalPage:
          type: integer
          minimum: 1
        row:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        imageUrl:
          type: string
    BinderPreviewArt:
      type: object
      additionalProperties: false
      description: >-
        Story 20: one placed multi-slot art item within the preview
        spread - only the placement, geometry, and image data the
        miniature layout needs to render it, excluding the art's own
        title/description/timestamps.
      required:
        - physicalPage
        - row
        - column
        - widthSlots
        - heightSlots
        - imageUrl
        - imageRotationDegrees
        - focalX
        - focalY
        - scaleX
        - scaleY
        - borderColor
        - borderRadius
        - borderWidth
      properties:
        physicalPage:
          type: integer
          minimum: 1
        row:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        widthSlots:
          type: integer
          minimum: 1
        heightSlots:
          type: integer
          minimum: 1
        imageUrl:
          type: string
        imageRotationDegrees:
          type: number
        focalX:
          type: number
        focalY:
          type: number
        scaleX:
          type: number
        scaleY:
          type: number
        borderColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        borderRadius:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        borderWidth:
          type: number
          minimum: 0
          nullable: true
    BinderPreview:
      type: object
      additionalProperties: false
      description: >-
        Story 20: the binder's saved `previewPhysicalPage` resolved to a
        spread plus the cards and multi-slot art placed within it - the
        complete data the home-page preview needs to render, embedded
        directly in each `BinderSummary` so the home page issues no
        separate preview requests.
      required:
        - spread
        - cards
        - art
      properties:
        spread:
          $ref: '#/components/schemas/BinderPreviewSpread'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/BinderPreviewCard'
        art:
          type: array
          items:
            $ref: '#/components/schemas/BinderPreviewArt'
    PlacementCoordinates:
      type: object
      additionalProperties: false
      description: >-
        One-based physical page, row, and column. All three are populated
        for a placed item and all three are null for an unplaced item
        (story 15's unplaced-cards section).
      required:
        - physicalPage
        - row
        - column
      properties:
        physicalPage:
          type: integer
          minimum: 1
          nullable: true
        row:
          type: integer
          minimum: 1
          nullable: true
        column:
          type: integer
          minimum: 1
          nullable: true
    CardPositionUpdate:
      type: object
      additionalProperties: false
      description: >-
        One card's expected current placement and its final placement
        (story 14), used within `MoveCardsRequest`.
      required:
        - cardId
        - expectedPlacement
        - finalPlacement
      properties:
        cardId:
          type: string
          format: uuid
        expectedPlacement:
          $ref: '#/components/schemas/PlacementCoordinates'
        finalPlacement:
          $ref: '#/components/schemas/PlacementCoordinates'
    MoveCardsRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /cards/{cardId}`'s request body (story 14): one update for a
        simple move, or two updates - the dragged card and the destination's
        prior occupant - for a swap.
      required:
        - updates
      properties:
        updates:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/CardPositionUpdate'
    UpdateCardVariationRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /cards/{cardId}`'s variation-update request body (story 16):
        replaces the path card's saved variation using last-write-wins
        semantics. Trimmed on the backend; a blank value is stored as
        `null`, and one value replaces the previous value.
      required:
        - variation
      properties:
        variation:
          type: string
          maxLength: 50
          nullable: true
    UpdateCardAcquiredRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /cards/{cardId}`'s acquisition-update request body (story
        36): replaces the path card's `acquired` field using last-write-wins
        semantics - the same endpoint used for placement and variation
        edits, rather than a dedicated acquire/unacquire endpoint.
      required:
        - acquired
      properties:
        acquired:
          type: boolean
    UpdateCardsAcquisitionRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /binders/{binderId}/cards/acquisition`'s request body
        (story 46): bulk-replaces `acquired` for every listed card in one
        request, mirroring `UpdateCardAcquiredRequest`'s single-card shape
        but applied to many cards at once - used by the Card List tab's
        (story 37) select-all/deselect-all header control.
      required:
        - cardIds
        - acquired
      properties:
        cardIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        acquired:
          type: boolean
    TcgDexCatalogCard:
      type: object
      additionalProperties: false
      description: >-
        A normalized catalog card returned by `GET /card-catalog/search`
        (TCGdex, story 11; pokemontcg.io, story 43) and submitted as-is
        (plus variation and placement) to create a provider-sourced binder
        card via `POST /binders/{binderId}/cards/bulk`.
      required:
        - source
        - name
        - setName
        - localNumber
        - providerCardId
        - providerSetId
        - imageUrl
      properties:
        source:
          $ref: '#/components/schemas/CardSearchProvider'
        name:
          type: string
        setName:
          type: string
          nullable: true
        localNumber:
          type: string
          nullable: true
        providerCardId:
          type: string
          description: >-
            The provider's own card identifier - TCGdex's card `id`, or,
            for `pokemontcg`, pokemontcg.io's own card `id` (story 43).
        providerSetId:
          type: string
          description: >-
            The provider's own set identifier - TCGdex's set id, or, for
            `pokemontcg`, that card's pokemontcg.io `set.id` (story 43).
        imageUrl:
          type: string
          format: uri
          description: The provider's image location; not the frontend-facing image URL.
    CardSearchProvider:
      type: string
      description: >-
        Which card catalog provider a search or creation request targets
        (story 43): the Pokémon TCG API (pokemontcg.io, default) or
        TCGdex.
      enum:
        - tcgdex
        - pokemontcg
    CardSearchLanguage:
      type: string
      description: Which TCGdex-language dataset a card-catalog search targets (story 41).
      enum:
        - en
        - ja
    CardSearchResponse:
      type: object
      additionalProperties: false
      description: >-
        `GET /card-catalog/search`'s response body (story 41). Wraps the
        normalized results with a nonblocking translation-warning flag
        instead of returning a bare array, so an unsuccessful
        English-to-Japanese translation attempt can be surfaced without an
        error response.
      required:
        - results
        - translationWarning
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TcgDexCatalogCard'
        translationWarning:
          type: boolean
          description: >-
            True only when `language=ja` and `query` looked like an English
            Pokémon species name attempt but no matching translation was
            found, so TCGdex was searched using the original entered query
            instead.
    BulkTargetPlacement:
      type: object
      additionalProperties: false
      description: >-
        A fully-populated one-based physical page, row, and column
        (stories 17/18) - unlike `PlacementCoordinates`, never null,
        since `BulkCreateCardsRequest` simply omits this property entirely
        for a session that targets the unplaced-cards section instead of a
        real slot.
      required:
        - physicalPage
        - row
        - column
      properties:
        physicalPage:
          type: integer
          minimum: 1
        row:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
    BulkCreateCardsRequest:
      type: object
      additionalProperties: false
      description: >-
        `POST /binders/{binderId}/cards/bulk`'s request body (stories 17
        and 18): the checked subset of a card catalog search (TCGdex or
        pokemontcg.io, story 43), in search-result order, plus one optional
        shared variation applied to every created card and one optional
        target placement applied only to the first array element.
      required:
        - cards
      properties:
        cards:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TcgDexCatalogCard'
        variation:
          type: string
          maxLength: 50
          nullable: true
        acquired:
          type: boolean
          description: >-
            Story 36: applied to every card created by this request,
            mirroring the shared `variation` field above. Omitted defaults
            to unacquired.
        targetPlacement:
          $ref: '#/components/schemas/BulkTargetPlacement'
    BulkCardOutcome:
      type: object
      additionalProperties: false
      description: >-
        One submitted card's independent creation outcome (stories 17 and
        18), preserving the submitted array's order regardless of
        processing completion order.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - created
            - failed
        card:
          description: Present only when `status` is `created`.
          allOf:
            - $ref: '#/components/schemas/Card'
        problem:
          description: Present only when `status` is `failed`.
          allOf:
            - $ref: '#/components/schemas/ProblemDetails'
    CardPriceFetchRequest:
      type: object
      additionalProperties: false
      description: >-
        `POST /binders/{binderId}/cards/prices/fetch`'s request body
        (story 38): requests pokemontcg.io price data for exactly this set
        of card ids - the Card List's currently filtered/displayed cards,
        not every card in the binder.
      required:
        - cardIds
      properties:
        cardIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CardPriceVariant:
      type: object
      additionalProperties: false
      description: >-
        One pokemontcg.io print variant's normalized price data for a
        card (story 38), e.g. `holofoil`, `normal`, `reverseHolofoil`.
        Only variant keys pokemontcg.io actually reports for that card are
        included.
      required:
        - variantKey
        - marketPrice
        - lowPrice
      properties:
        variantKey:
          type: string
        marketPrice:
          type: number
          nullable: true
          description: US dollars, to two decimal places. Null when unavailable.
        lowPrice:
          type: number
          nullable: true
          description: US dollars, to two decimal places. Null when unavailable.
    CardPriceFetchResult:
      type: object
      additionalProperties: false
      description: >-
        One requested card's price-fetch outcome (story 38), preserving
        the request's `cardIds` order. An empty `variants` array means the
        card couldn't be confidently matched to a pokemontcg.io card, or it
        matched but pokemontcg.io has no TCGplayer price data for it - both
        display identically on the frontend (`--` for market/lowest price
        and the price-change indicator). `tcgplayerUrl` is the same
        TCGplayer product-page link for every variant of this card
        (pokemontcg.io only exposes one per card, not per variant); it's a
        best-guess link inferred from the card's pokemontcg.io id even when
        `variants` is empty, and null only when no pokemontcg.io set could
        be resolved for this card at all.
      required:
        - cardId
        - variants
        - tcgplayerUrl
      properties:
        cardId:
          type: string
          format: uuid
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CardPriceVariant'
        tcgplayerUrl:
          type: string
          format: uri
          nullable: true
    CardPriceUpdate:
      type: object
      additionalProperties: false
      description: >-
        One reviewed row of `PATCH /binders/{binderId}/cards/prices`'s
        request body (story 38): the new-price value being committed for
        one card, plus whether it was hand-edited.
      required:
        - cardId
        - price
        - isManualPrice
      properties:
        cardId:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0
          description: US dollars, to two decimal places.
        isManualPrice:
          type: boolean
    UpdateCardPricesRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /binders/{binderId}/cards/prices`'s request body (story 38):
        commits every reviewed row's new-price value at once (the "Save
        all" action).
      required:
        - prices
      properties:
        prices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CardPriceUpdate'
    CardPriceUpdateOutcome:
      type: object
      additionalProperties: false
      description: >-
        One submitted price's independent save outcome (story 38),
        mirroring `BulkCardOutcome`'s "created"/"failed" pattern and
        preserving the submitted array's order regardless of processing
        completion order.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - updated
            - failed
        card:
          description: Present only when `status` is `updated`.
          allOf:
            - $ref: '#/components/schemas/Card'
        problem:
          description: Present only when `status` is `failed`.
          allOf:
            - $ref: '#/components/schemas/ProblemDetails'
    CreateCustomCardRequest:
      type: object
      additionalProperties: false
      description: >-
        Creates a manually-entered custom binder card via `multipart/
        form-data` (story 12). The backend assigns `source: 'custom'`
        server-side, never accepts TCGdex identity fields, and computes a
        SHA-256 digest of the uploaded image while streaming it to
        temporary storage so identical uploads share one image asset.
        Placement is optional: supply `physicalPage`, `row`, and `column`
        together for a placed card, or omit all three for an unplaced card
        (story 15's unplaced-cards section) - supplying only some of the
        three is rejected.
      required:
        - name
        - image
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        setName:
          type: string
          maxLength: 100
          description: Trimmed on the backend; a blank value is stored as null.
        localNumber:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        variation:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        acquired:
          type: boolean
          description: >-
            Story 36: unchecked by default on the modal's form; omitted
            defaults to unacquired.
        physicalPage:
          type: integer
          minimum: 1
        row:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        image:
          type: string
          format: binary
          description: >-
            Required. Must be a JPEG, PNG, or WebP file; the backend
            validates the file's signature rather than trusting its name
            or multipart MIME type.
    UpdateCardDetailsRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /cards/{cardId}/details`'s request body (story 49,
        `multipart/form-data`): replaces the path card's name, set,
        number, variation, and price in one request, and optionally its
        image - applies identically regardless of the card's `source`
        (`tcgdex` or `custom`); editing these fields never changes
        `source`, `providerCardId`, or `providerSetId`. If the submitted
        `price` differs from the card's previously saved price, the
        backend also sets `isManualPrice` to `true` and `priceUpdatedAt`
        to the current time as part of this same save; editing any other
        field leaves both unchanged.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        setName:
          type: string
          maxLength: 100
          description: Trimmed on the backend; a blank value is stored as null.
        localNumber:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        variation:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        price:
          type: number
          minimum: 0
          description: >-
            US dollars, to two decimal places. Omitted (rather than sent
            as an empty value) clears the card's saved price, storing
            null.
        image:
          type: string
          format: binary
          description: >-
            Optional. When supplied, must be a JPEG, PNG, or WebP file
            (the backend validates the file's signature); when omitted,
            the card's existing image is left unchanged.
    Card:
      type: object
      additionalProperties: false
      description: The complete persisted representation of a binder-owned card.
      required:
        - id
        - binderId
        - name
        - setName
        - localNumber
        - source
        - providerCardId
        - providerSetId
        - variation
        - placement
        - imageUrl
        - acquired
        - price
        - isManualPrice
        - priceUpdatedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        binderId:
          type: string
          format: uuid
        name:
          type: string
        setName:
          type: string
          nullable: true
        localNumber:
          type: string
          nullable: true
        source:
          type: string
          description: >-
            Story 43 adds `pokemontcg` alongside the original `tcgdex`/
            `custom` values.
          enum:
            - tcgdex
            - pokemontcg
            - custom
        providerCardId:
          type: string
          nullable: true
        providerSetId:
          type: string
          nullable: true
        variation:
          type: string
          nullable: true
        placement:
          $ref: '#/components/schemas/PlacementCoordinates'
        imageUrl:
          type: string
          format: uri-reference
          description: The backend's own `/cards/{cardId}/image` endpoint URL.
        acquired:
          type: boolean
          description: >-
            Story 36: whether this card has been acquired. Defaults to
            `false` for a newly created card and is updated through
            `PATCH /cards/{cardId}`'s acquisition-update request body.
        price:
          type: number
          nullable: true
          description: >-
            Story 38: US dollars, to two decimal places. Null until a
            price has ever been fetched or manually entered for this card;
            set by `PATCH /binders/{binderId}/cards/prices`.
        isManualPrice:
          type: boolean
          description: >-
            Story 38: whether `price` was hand-edited by the user (true)
            rather than auto-filled from an unedited pokemontcg.io market
            or lowest price (false) at the moment it was last saved.
            Defaults to `false` for a newly created card.
        priceUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Story 38: set whenever `price` changes; null until then.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WatchlistEntryList:
      type: object
      additionalProperties: false
      description: >-
        `GET /watchlist-entries`'s response body (story 52): every entry
        plus the persisted PDF export divider position, together since the
        latter is a single global value rather than a per-entry field.
      required:
        - entries
        - pdfExportCutoffCount
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistEntry'
        pdfExportCutoffCount:
          type: integer
          description: >-
            How many entries (in persisted `sortOrder`) currently sit
            above the PDF export divider.
    WatchlistEntry:
      type: object
      additionalProperties: false
      description: >-
        One entry on the shared "What I'm Looking For" list (story 45).
        When `cardId` is set, every other display/edit field below is
        hydrated from that card's own row (name, price, etc. are the
        card's current values, not a separate copy); when `cardId` is
        null, they come from this entry's own standalone columns. There's
        no `acquired` field - the list's table omits the Acquisition
        column entirely, and `cardId` alone determines whether the
        "mark as acquired" action is available for a row.
      required:
        - id
        - cardId
        - sortOrder
        - name
        - setName
        - localNumber
        - source
        - providerCardId
        - providerSetId
        - variation
        - imageUrl
        - price
        - isManualPrice
        - priceUpdatedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set only when this entry references an existing binder card
            rather than being standalone.
        sortOrder:
          type: integer
          description: >-
            This entry's persisted position in the list's own drag-and-
            drop order (story 52). A reorder renumbers every entry's
            `sortOrder` sequentially (0..n-1); used as the default entry
            order when no column sort is active.
        name:
          type: string
        setName:
          type: string
          nullable: true
        localNumber:
          type: string
          nullable: true
        source:
          type: string
          description: >-
            Story 43 adds `pokemontcg` alongside the original `tcgdex`/
            `custom` values.
          enum:
            - tcgdex
            - pokemontcg
            - custom
        providerCardId:
          type: string
          nullable: true
        providerSetId:
          type: string
          nullable: true
        variation:
          type: string
          nullable: true
        imageUrl:
          type: string
          format: uri-reference
          description: >-
            For a referenced entry, the card's own `/cards/{cardId}/image`
            URL; for a standalone entry, this entry's own
            `/watchlist-entries/{watchlistEntryId}/image` URL.
        price:
          type: number
          nullable: true
          description: US dollars, to two decimal places.
        isManualPrice:
          type: boolean
        priceUpdatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateWatchlistEntryRequest:
      type: object
      additionalProperties: false
      description: >-
        `POST /watchlist-entries`'s request body (story 45,
        `multipart/form-data`): creates a standalone `custom`-sourced
        entry, mirroring `CreateCustomCardRequest` minus placement and
        acquisition, which have no meaning for a binder-less entry.
      required:
        - name
        - image
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        setName:
          type: string
          maxLength: 100
          description: Trimmed on the backend; a blank value is stored as null.
        localNumber:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        variation:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        image:
          type: string
          format: binary
          description: >-
            Required. Must be a JPEG, PNG, or WebP file; the backend
            validates the file's signature rather than trusting its name
            or multipart MIME type.
    UpdateWatchlistEntryRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /watchlist-entries/{watchlistEntryId}`'s request body
        (story 45, `multipart/form-data`): replaces a standalone entry's
        name, set, number, variation, price, and optionally its image in
        one request, mirroring `UpdateCardDetailsRequest`.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        setName:
          type: string
          maxLength: 100
          description: Trimmed on the backend; a blank value is stored as null.
        localNumber:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        variation:
          type: string
          maxLength: 50
          description: Trimmed on the backend; a blank value is stored as null.
        price:
          type: number
          minimum: 0
          description: >-
            US dollars, to two decimal places. Omitted (rather than sent
            as an empty value) clears the entry's saved price, storing
            null.
        image:
          type: string
          format: binary
          description: >-
            Optional. When supplied, must be a JPEG, PNG, or WebP file
            (the backend validates the file's signature); when omitted,
            the entry's existing image is left unchanged.
    BulkCreateWatchlistEntriesRequest:
      type: object
      additionalProperties: false
      description: >-
        `POST /watchlist-entries/bulk`'s request body (story 45): the
        checked subset of a card catalog search (TCGdex or pokemontcg.io,
        story 43), in search-result order, plus one optional shared
        variation applied to every created entry - mirroring
        `BulkCreateCardsRequest` minus placement and acquisition, which
        have no meaning for a binder-less entry.
      required:
        - cards
      properties:
        cards:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TcgDexCatalogCard'
        variation:
          type: string
          maxLength: 50
          nullable: true
    BulkWatchlistEntryOutcome:
      type: object
      additionalProperties: false
      description: >-
        One submitted card's independent creation outcome (story 45),
        preserving the submitted array's order regardless of processing
        completion order, mirroring `BulkCardOutcome`.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - created
            - failed
        entry:
          description: Present only when `status` is `created`.
          allOf:
            - $ref: '#/components/schemas/WatchlistEntry'
        problem:
          description: Present only when `status` is `failed`.
          allOf:
            - $ref: '#/components/schemas/ProblemDetails'
    BulkAddCardsToWatchlistRequest:
      type: object
      additionalProperties: false
      required:
        - cardIds
      description: >-
        `POST /cards/watchlist-entries/bulk`'s request body (story 45) -
        the bulk variant of `POST /cards/{cardId}/watchlist-entry`.
      properties:
        cardIds:
          type: array
          minItems: 1
          description: >-
            The ids of the binder cards to add to the What I'm Looking For
            list by reference.
          items:
            type: string
            format: uuid
    BulkAddCardsToWatchlistOutcome:
      type: object
      additionalProperties: false
      description: >-
        One submitted card id's independent add-by-reference outcome
        (story 45), preserving the request's `cardIds` order regardless of
        processing completion order, mirroring `BulkWatchlistEntryOutcome`.
      required:
        - cardId
        - status
      properties:
        cardId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - added
            - failed
        entry:
          description: >-
            Present only when `status` is `added` - either a newly created
            entry, or the card's existing entry if it was already listed.
          allOf:
            - $ref: '#/components/schemas/WatchlistEntry'
        problem:
          description: >-
            Present only when `status` is `failed` (e.g. the id doesn't
            currently identify a card).
          allOf:
            - $ref: '#/components/schemas/ProblemDetails'
    ExportWatchlistPdfRequest:
      type: object
      additionalProperties: false
      required:
        - watchlistEntryIds
      description: >-
        `POST /watchlist-entries/exports/pdf`'s request body (story 45) -
        the What I'm Looking For list's currently filtered/searched entry
        ids, in the manually-dragged order when one is set, or the table's
        active column-sort order otherwise, mirroring
        `ExportCardsPdfRequest`'s `cardIds` contract.
      properties:
        watchlistEntryIds:
          type: array
          description: >-
            The ids of the entries to include in the generated PDF, in the
            order they should be rendered. Every id must currently
            identify an entry; the array must not be empty.
          items:
            type: string
            format: uuid
    WatchlistEntryPriceFetchRequest:
      type: object
      additionalProperties: false
      description: >-
        `POST /watchlist-entries/prices/fetch`'s request body (story 45),
        mirroring `CardPriceFetchRequest`.
      required:
        - watchlistEntryIds
      properties:
        watchlistEntryIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    WatchlistEntryPriceFetchResult:
      type: object
      additionalProperties: false
      description: >-
        One requested entry's price-fetch outcome (story 45), preserving
        the request's `watchlistEntryIds` order, mirroring
        `CardPriceFetchResult`.
      required:
        - watchlistEntryId
        - variants
        - tcgplayerUrl
      properties:
        watchlistEntryId:
          type: string
          format: uuid
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CardPriceVariant'
        tcgplayerUrl:
          type: string
          format: uri
          nullable: true
    WatchlistEntryPriceUpdate:
      type: object
      additionalProperties: false
      description: >-
        One reviewed row of `PATCH /watchlist-entries/prices`'s request
        body (story 45), mirroring `CardPriceUpdate`.
      required:
        - watchlistEntryId
        - price
        - isManualPrice
      properties:
        watchlistEntryId:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0
          description: US dollars, to two decimal places.
        isManualPrice:
          type: boolean
    UpdateWatchlistEntryPricesRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /watchlist-entries/prices`'s request body (story 45): commits
        every reviewed row's new-price value at once, mirroring
        `UpdateCardPricesRequest`.
      required:
        - prices
      properties:
        prices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WatchlistEntryPriceUpdate'
    WatchlistEntryPriceUpdateOutcome:
      type: object
      additionalProperties: false
      description: >-
        One submitted price's independent save outcome (story 45),
        mirroring `CardPriceUpdateOutcome`.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - updated
            - failed
        entry:
          description: Present only when `status` is `updated`.
          allOf:
            - $ref: '#/components/schemas/WatchlistEntry'
        problem:
          description: Present only when `status` is `failed`.
          allOf:
            - $ref: '#/components/schemas/ProblemDetails'
    UpdateWatchlistEntryOrderRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /watchlist-entries/order`'s request body (story 52): a
        full replacement of every entry's `sortOrder` (as a plain ordered
        id array, renumbered 0..n-1 server-side) plus the new PDF export
        divider position, applied together in one transaction.
      required:
        - orderedEntryIds
        - pdfExportCutoffCount
      properties:
        orderedEntryIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Every current watchlist entry id, exactly once, in the new
            persisted order.
        pdfExportCutoffCount:
          type: integer
          description: >-
            How many entries (from the start of `orderedEntryIds`) should
            sit above the PDF export divider.
    UpdateWatchlistEntryOrderResponse:
      type: object
      additionalProperties: false
      description: "`PATCH /watchlist-entries/order`'s response body (story 52)."
      required:
        - pdfExportCutoffCount
      properties:
        pdfExportCutoffCount:
          type: integer
    CreateArtRequest:
      type: object
      additionalProperties: false
      description: >-
        Creates multi-slot art via `multipart/form-data` (story 25). New
        art always starts in the unplaced-art section (all-null
        placement); the backend computes a SHA-256 digest of the uploaded
        image while streaming it to temporary storage so identical uploads
        share one art image asset, and uses `sharp` to inspect pixel
        dimensions and generate an EXIF-auto-oriented rendering derivative
        when needed.
      required:
        - title
        - widthSlots
        - heightSlots
        - image
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        description:
          type: string
          maxLength: 10000
          description: Trimmed on the backend; a blank value is stored as null.
        widthSlots:
          type: integer
          minimum: 1
          description: Must not exceed the binder's current width.
        heightSlots:
          type: integer
          minimum: 1
          description: Must not exceed the binder's current height.
        imageRotationDegrees:
          type: integer
          enum: [0, 90, 180, 270]
          default: 0
        focalX:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: >-
            Normalized focal X coordinate relative to the computed
            centered-cover fit; rounded to 4 decimal places.
        focalY:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        scaleX:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Horizontal scale multiplier relative to the centered-cover fit.
        scaleY:
          type: number
          exclusiveMinimum: 0
          default: 1
        borderColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
          description: Null uses the binder's current border color at render time.
        borderRadius:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Null uses the binder's current border radius at render time.
        borderWidth:
          type: number
          minimum: 0
          nullable: true
          description: >-
            Centimeters, to two decimal places, zero or greater. Null uses
            the binder's current border width at render time.
        image:
          type: string
          format: binary
          description: >-
            Required. Must be a JPEG, PNG, or WebP file; the backend
            validates the file's signature rather than trusting its name
            or multipart MIME type.
    Art:
      type: object
      additionalProperties: false
      description: The complete persisted representation of one multi-slot-art item.
      required:
        - id
        - binderId
        - title
        - description
        - widthSlots
        - heightSlots
        - placement
        - imageUrl
        - imageRotationDegrees
        - focalX
        - focalY
        - scaleX
        - scaleY
        - borderColor
        - borderRadius
        - borderWidth
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        binderId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        widthSlots:
          type: integer
        heightSlots:
          type: integer
        placement:
          $ref: '#/components/schemas/PlacementCoordinates'
        imageUrl:
          type: string
          format: uri-reference
          description: The backend's own `/art/{artId}/image` endpoint URL.
        imageRotationDegrees:
          type: integer
          enum: [0, 90, 180, 270]
        focalX:
          type: number
        focalY:
          type: number
        scaleX:
          type: number
        scaleY:
          type: number
        borderColor:
          type: string
          nullable: true
        borderRadius:
          type: number
          nullable: true
        borderWidth:
          type: number
          nullable: true
          description: Centimeters, to two decimal places. Null means the binder's current border width applies at render time.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MoveArtRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /art/{artId}`'s `application/json` movement body (story 26).
        Unlike `MoveCardsRequest`, art never swaps - the destination is
        always for the one art item the path identifies - so this is a
        single expected/final placement pair rather than an array.
      required:
        - expectedPlacement
        - finalPlacement
      properties:
        expectedPlacement:
          $ref: '#/components/schemas/PlacementCoordinates'
        finalPlacement:
          $ref: '#/components/schemas/PlacementCoordinates'
    UpdateArtRequest:
      type: object
      additionalProperties: false
      description: >-
        Edits an existing art item's metadata, transform, and style
        overrides via `multipart/form-data` (story 26), mirroring
        `CreateArtRequest`'s fields except that `image` is optional -
        omitting it keeps the art's current image.
      required:
        - title
        - widthSlots
        - heightSlots
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and required after trimming on the backend.
        description:
          type: string
          maxLength: 10000
          description: Trimmed on the backend; a blank value is stored as null.
        widthSlots:
          type: integer
          minimum: 1
          description: Must not exceed the binder's current width.
        heightSlots:
          type: integer
          minimum: 1
          description: Must not exceed the binder's current height.
        imageRotationDegrees:
          type: integer
          enum: [0, 90, 180, 270]
          default: 0
        focalX:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        focalY:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        scaleX:
          type: number
          exclusiveMinimum: 0
          default: 1
        scaleY:
          type: number
          exclusiveMinimum: 0
          default: 1
        borderColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
          description: Null uses the binder's current border color at render time.
        borderRadius:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Null uses the binder's current border radius at render time.
        borderWidth:
          type: number
          minimum: 0
          nullable: true
          description: >-
            Centimeters, to two decimal places, zero or greater. Null uses
            the binder's current border width at render time.
        moveToUnplacedOnConflict:
          type: boolean
          default: false
          description: >-
            When `true`, confirms saving even though the edited dimensions
            would leave currently-placed art out of bounds or overlapping
            another item; the art is moved to the unplaced-art section in
            the same request instead of returning `409 Conflict`.
        image:
          type: string
          format: binary
          description: >-
            Optional. When supplied, must be a JPEG, PNG, or WebP file; the
            backend validates the file's signature rather than trusting
            its name or multipart MIME type. Omitting it keeps the art's
            current image.
    SelectedBinderCostEntryId:
      type: string
      format: uuid
      nullable: true
      description: >-
        Story 34: the id of this binder's currently selected shared Binder
        cost entry, or null when none is selected. Setting one requires
        the entry's own stored width, height, and pages to match this
        binder's effective values; changing the binder's width, height, or
        pages clears a selection that no longer matches. Never restricted
        by `locked`.
    SelectedPrintingCostEntryId:
      type: string
      format: uuid
      nullable: true
      description: >-
        Story 34: the id of this binder's currently selected shared
        Printing cost entry, or null when none is selected. Never
        restricted by `locked`.
    SelectedHolographicPaperCostEntryId:
      type: string
      format: uuid
      nullable: true
      description: >-
        Story 34: the id of this binder's currently selected shared
        Holographic Paper cost entry, or null when none is selected. Never
        restricted by `locked`.
    ArtPrintPageCountResult:
      type: object
      additionalProperties: false
      description: >-
        `GET /binders/{binderId}/art-print-page-count`'s response (story
        34).
      required:
        - pageCount
      properties:
        pageCount:
          type: integer
          minimum: 0
          description: >-
            The number of pages this binder's currently placed multi-slot
            art would print across, per story 30's packing/tiling
            heuristic. Zero when no art is currently placed.
    CostEntryName:
      type: string
      minLength: 1
      maxLength: 100
      description: >-
        Trimmed on the backend; required and at most 100 characters after
        trimming (the shared COST_ENTRY_NAME_MAX_LENGTH value). Duplicate
        names across entries in the same catalog are allowed.
    CostEntryPrice:
      type: number
      exclusiveMinimum: 0
      description: US dollars, to two decimal places. Must be greater than zero.
    TimeCostRateBasis:
      type: object
      additionalProperties: false
      description: >-
        Story 34: one time-cost category's rate basis - "it takes
        referenceMinutes minutes to do referencePages pages" (e.g. "25
        minutes to do 8 pages") - stored and shared across every binder,
        never scoped to one. `referencePages` is null for a category
        whose cost is a flat, one-time cost that doesn't scale with page
        count (currently only Printing); in that case referenceMinutes is
        used directly as the binder's total minutes for that category,
        without multiplying by page count.
      required:
        - referenceMinutes
        - referencePages
      properties:
        referenceMinutes:
          type: number
          minimum: 0
          description: >-
            Minutes it takes to complete referencePages pages, or (when
            referencePages is null) the flat number of minutes this
            one-time cost always takes.
        referencePages:
          type: integer
          exclusiveMinimum: 0
          nullable: true
          description: >-
            The number of pages referenceMinutes corresponds to, or null
            when this category's cost is a flat, one-time cost that
            doesn't scale with page count (currently only Printing).
    UpdateTimeCostRateBasis:
      type: object
      additionalProperties: false
      description: A partial update to one time-cost category's rate basis.
      minProperties: 1
      properties:
        referenceMinutes:
          type: number
          minimum: 0
        referencePages:
          type: integer
          exclusiveMinimum: 0
    TimeCosts:
      type: object
      additionalProperties: false
      description: >-
        Story 34's 5 fixed time-cost categories, each with its own
        independent rate basis.
      required:
        - designing
        - printing
        - applyingHolographicPaper
        - cutting
        - placing
      properties:
        designing:
          $ref: '#/components/schemas/TimeCostRateBasis'
        printing:
          $ref: '#/components/schemas/TimeCostRateBasis'
        applyingHolographicPaper:
          $ref: '#/components/schemas/TimeCostRateBasis'
        cutting:
          $ref: '#/components/schemas/TimeCostRateBasis'
        placing:
          $ref: '#/components/schemas/TimeCostRateBasis'
    UpdateTimeCosts:
      type: object
      additionalProperties: false
      description: A partial update to any subset of the 5 time-cost categories.
      minProperties: 1
      properties:
        designing:
          $ref: '#/components/schemas/UpdateTimeCostRateBasis'
        printing:
          $ref: '#/components/schemas/UpdateTimeCostRateBasis'
        applyingHolographicPaper:
          $ref: '#/components/schemas/UpdateTimeCostRateBasis'
        cutting:
          $ref: '#/components/schemas/UpdateTimeCostRateBasis'
        placing:
          $ref: '#/components/schemas/UpdateTimeCostRateBasis'
    FinanceSettings:
      type: object
      additionalProperties: false
      description: >-
        Story 34's global finance-settings singleton - never scoped to a
        binder, seeded once by the schema migration.
      required:
        - wagePerHour
        - errorMarginPercent
        - salesTaxPercent
        - timeCosts
        - updatedAt
      properties:
        wagePerHour:
          type: number
          minimum: 0
          description: US dollars per hour, to two decimal places.
        errorMarginPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Percentage of the page count added as "extra pages" to account
            for pages that must be redone due to human error.
        salesTaxPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Sales tax percentage applied to the "Total (excl. Cards)"
            figure to produce the "With Tax" total. Defaults to Georgia's
            flat state sales tax rate (4%).
        timeCosts:
          $ref: '#/components/schemas/TimeCosts'
        updatedAt:
          type: string
          format: date-time
    UpdateFinanceSettingsRequest:
      type: object
      additionalProperties: false
      description: >-
        `PATCH /finance-settings`'s request body (story 34); a partial
        update, including independently-partial nested timeCosts
        categories.
      minProperties: 1
      properties:
        wagePerHour:
          type: number
          minimum: 0
        errorMarginPercent:
          type: integer
          minimum: 0
          maximum: 100
        salesTaxPercent:
          type: integer
          minimum: 0
          maximum: 100
        timeCosts:
          $ref: '#/components/schemas/UpdateTimeCosts'
    BinderCostEntry:
      type: object
      additionalProperties: false
      description: >-
        Story 34's shared Binder physical-cost catalog entry - a saved
        one-time acquisition price for a binder of the given width,
        height, and page count.
      required:
        - id
        - name
        - price
        - width
        - height
        - pages
        - binderCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/CostEntryName'
        price:
          $ref: '#/components/schemas/CostEntryPrice'
        width:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot columns per binder side this entry applies to.
        height:
          type: integer
          minimum: 1
          maximum: 8
          description: Number of slot rows per binder side this entry applies to.
        pages:
          type: integer
          exclusiveMinimum: 0
          description: Stored binder-page count this entry applies to.
        binderCount:
          type: integer
          minimum: 0
          description: >-
            Count of binders currently selecting this entry as
            selectedBinderCostEntryId (story 44); not persisted on the
            entry itself.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateBinderCostEntryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - price
        - width
        - height
        - pages
      properties:
        name:
          $ref: '#/components/schemas/CostEntryName'
        price:
          $ref: '#/components/schemas/CostEntryPrice'
        width:
          type: integer
          minimum: 1
          maximum: 8
        height:
          type: integer
          minimum: 1
          maximum: 8
        pages:
          type: integer
          exclusiveMinimum: 0
    UpdateBinderCostEntryRequest:
      type: object
      additionalProperties: false
      description: A partial update; only supplied fields are changed.
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/CostEntryName'
        price:
          $ref: '#/components/schemas/CostEntryPrice'
        width:
          type: integer
          minimum: 1
          maximum: 8
        height:
          type: integer
          minimum: 1
          maximum: 8
        pages:
          type: integer
          exclusiveMinimum: 0
    PrintingCostEntry:
      type: object
      additionalProperties: false
      description: >-
        Story 34's shared Printing physical-cost catalog entry - a saved
        per-printed-page price.
      required:
        - id
        - name
        - pricePerPage
        - binderCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/CostEntryName'
        pricePerPage:
          $ref: '#/components/schemas/CostEntryPrice'
        binderCount:
          type: integer
          minimum: 0
          description: >-
            Count of binders currently selecting this entry as
            selectedPrintingCostEntryId (story 44); not persisted on the
            entry itself.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePrintingCostEntryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - pricePerPage
      properties:
        name:
          $ref: '#/components/schemas/CostEntryName'
        pricePerPage:
          $ref: '#/components/schemas/CostEntryPrice'
    UpdatePrintingCostEntryRequest:
      type: object
      additionalProperties: false
      description: A partial update; only supplied fields are changed.
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/CostEntryName'
        pricePerPage:
          $ref: '#/components/schemas/CostEntryPrice'
    HolographicPaperCostEntry:
      type: object
      additionalProperties: false
      description: >-
        Story 34's shared Holographic Paper physical-cost catalog entry - a
        saved price for a pack covering a fixed number of pages.
      required:
        - id
        - name
        - price
        - pagesIncluded
        - binderCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/CostEntryName'
        price:
          $ref: '#/components/schemas/CostEntryPrice'
        pagesIncluded:
          type: integer
          exclusiveMinimum: 0
          description: Number of pages one pack at this price covers.
        binderCount:
          type: integer
          minimum: 0
          description: >-
            Count of binders currently selecting this entry as
            selectedHolographicPaperCostEntryId (story 44); not persisted
            on the entry itself.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateHolographicPaperCostEntryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - price
        - pagesIncluded
      properties:
        name:
          $ref: '#/components/schemas/CostEntryName'
        price:
          $ref: '#/components/schemas/CostEntryPrice'
        pagesIncluded:
          type: integer
          exclusiveMinimum: 0
    UpdateHolographicPaperCostEntryRequest:
      type: object
      additionalProperties: false
      description: A partial update; only supplied fields are changed.
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/CostEntryName'
        price:
          $ref: '#/components/schemas/CostEntryPrice'
        pagesIncluded:
          type: integer
          exclusiveMinimum: 0
