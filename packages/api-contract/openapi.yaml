          description: The Printing cost entry collection, alphabetically ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrintingCostEntry'
    post:
      operationId: createPrintingCostEntry
      summary: Create a new Printing cost entry
      requestBody:
        required: true
