  /holographic-paper-cost-entries/{holographicPaperCostEntryId}:
    parameters:
      - $ref: '#/components/parameters/holographicPaperCostEntryId'
    patch:
      operationId: updateHolographicPaperCostEntry
      summary: Update a Holographic Paper cost entry
      description: >-
