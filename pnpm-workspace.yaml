packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'

onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
